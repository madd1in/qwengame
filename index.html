<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>Lichtpfad ✦ Das Licht-Rätsel</title>
<style>
  :root{ --cyan:#5fe0ff; --gold:#ffd76a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh; color:#dbe7ff; user-select:none;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 15% -10%, #14203c 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 20%, #1a1230 0%, transparent 55%),
      linear-gradient(180deg,#070b14,#05070d);
    display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:680px; padding:14px 14px 30px; }
  header{ text-align:center; padding:10px 0 4px; }
  header h1{
    margin:0; font-size:clamp(22px,4.5vw,32px); font-weight:800; letter-spacing:.38em; padding-left:.38em;
    background:linear-gradient(90deg,#7fe8ff,#c9b2ff 55%,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ margin:4px 0 0; color:#7f93b8; font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    margin:14px 0 10px; padding:9px 12px; border-radius:14px;
    background:rgba(255,255,255,.045); border:1px solid rgba(140,180,255,.14);
  }
  #lvlinfo{ display:flex; flex-direction:column; min-width:120px; }
  #lvlnum{ font-size:11px; letter-spacing:.14em; color:#7f93b8; text-transform:uppercase; }
  #lvlname{ font-size:16px; font-weight:700; color:#eaf3ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tb-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #moves{ font-size:12.5px; color:#a9bce0; margin-right:2px; white-space:nowrap; }
  .iconbtn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    color:#cfe6ff; width:33px; height:33px; border-radius:10px; cursor:pointer; font-size:15px; line-height:1; padding:0;
  }
  .iconbtn:hover{ background:rgba(255,255,255,.12); }
  #dots{ display:flex; gap:4px; margin:0 4px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#2a3450; border:1px solid #3b4a72; }
  .dot.done{ background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 8px rgba(95,224,255,.7); }
  .dot.cur{ border-color:#c9b2ff; box-shadow:0 0 0 3px rgba(201,178,255,.22); }
  #stage{ position:relative; display:flex; justify-content:center; }
  canvas{ touch-action:manipulation; border-radius:16px; }
  #hint{ text-align:center; color:#8fa3c8; font-size:13px; min-height:20px; margin:12px 4px 0; }
  #hint .opt{ color:#5f7196; }
  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(5,8,16,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border-radius:16px; z-index:5;
  }
  .hidden{ display:none !important; }
  .panel{
    background:linear-gradient(180deg,#111c33,#0b1222);
    border:1px solid rgba(130,180,255,.22); border-radius:18px;
    padding:26px 28px; text-align:center; max-width:88%;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .panel.wide{ width:480px; max-width:94%; max-height:92%; overflow:auto; }
  .panel .big{ font-size:24px; font-weight:800; letter-spacing:.1em; color:#eaf3ff; }
  .panel .big.brand{
    font-size:clamp(24px,5vw,32px); letter-spacing:.28em; padding-left:.28em;
    background:linear-gradient(90deg,#7fe8ff,#c9b2ff 55%,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .panel .sub{ color:#8fa3c8; font-size:13px; margin:8px 0 0; }
  .rules{ list-style:none; padding:0; margin:18px 0 20px; text-align:left; display:inline-block; }
  .rules li{ margin:9px 0; font-size:13.5px; color:#c4d4f2; max-width:340px; }
  .btn{
    background:linear-gradient(180deg,#3fdcff,#0ea5d8); color:#04202c; font-weight:800;
    border:none; padding:12px 26px; border-radius:999px; cursor:pointer; font-size:15px;
    box-shadow:0 6px 20px rgba(40,200,255,.35); letter-spacing:.03em;
  }
  .btn:hover{ filter:brightness(1.12); }
  .btn.ghost{ background:rgba(255,255,255,.08); color:#cfe6ff; box-shadow:none; border:1px solid rgba(255,255,255,.2); font-weight:600; }
  .btnrow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px; }
  .stars{ margin:14px 0 4px; }
  .stars span{ display:inline-block; font-size:40px; color:#39415a; margin:0 5px; }
  .stars span.on{ color:var(--gold); text-shadow:0 0 18px rgba(255,205,90,.75); animation:pop .55s backwards; }
  @keyframes pop{ 0%{transform:scale(0) rotate(-40deg);opacity:0} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .stat{ color:#a9bce0; font-size:14px; margin:6px 0 18px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:16px; }
  .card{
    background:rgba(255,255,255,.05); border:1px solid rgba(140,180,255,.18); border-radius:12px;
    padding:10px 6px 9px; cursor:pointer; display:flex; flex-direction:column; gap:4px; align-items:center;
    color:#dbe7ff; font-family:inherit;
  }
  .card:hover{ background:rgba(255,255,255,.11); }
  .card.cur{ border-color:#7fe8ff; box-shadow:0 0 0 2px rgba(127,232,255,.25); }
  .card.locked{ opacity:.42; cursor:default; }
  .cnum{ font-weight:800; font-size:17px; color:#7fe8ff; }
  .cname{ font-size:10.5px; color:#a9bce0; white-space:nowrap; overflow:hidden; max-width:100%; text-overflow:ellipsis; }
  .cstars{ font-size:11px; color:#ffd76a; letter-spacing:1px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✦ LICHTPFAD ✦</h1>
    <p>Das Licht-Rätsel · 10 Level</p>
  </header>
  <div id="topbar">
    <div id="lvlinfo">
      <span id="lvlnum">Level 1/10</span>
      <span id="lvlname">–</span>
    </div>
    <div id="tb-right">
      <span id="moves">Züge: 0</span>
      <span id="dots"></span>
      <button class="iconbtn" id="btnUndo"  title="Zug rückgängig">↩</button>
      <button class="iconbtn" id="btnReset" title="Level zurücksetzen">⟳</button>
      <button class="iconbtn" id="btnHint"  title="Lösung kurz anzeigen">💡</button>
      <button class="iconbtn" id="btnMenu"  title="Levelwahl">⊞</button>
      <button class="iconbtn" id="btnSound" title="Ton an/aus">🔊</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
  </div>
  <p id="hint"></p>
</div>

<script>
(function(){
"use strict";
// ---------- Grundlagen ----------
const DIRS=[{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}]; // 0=oben 1=rechts 2=unten 3=links
function refl(d,o){ return o===0 ? [1,0,3,2][d] : [3,2,1,0][d]; } // 0="/" 1="\"
function angOf(o){ return o ? Math.PI/4 : -Math.PI/4; }

// Farben: 0=weiß 1=rot 2=grün 3=blau
const BEAMRGB =[[120,228,255],[255,99,120],[92,232,146],[132,146,255]];
const BEAMCORE=['#eafcff','#ffe3e8','#e2ffe9','#e4e6ff'];
const TCOL=[
 {lit1:'#fff3c9',lit2:'#ffb63e',un:'rgba(120,100,165,0.35)',stU:'rgba(178,148,255,0.75)',stL:'#ffe9a8',gl:'255,214,100'},
 {lit1:'#ffdfe4',lit2:'#ff3d5e',un:'rgba(255,93,115,0.16)', stU:'rgba(255,120,140,0.80)',stL:'#ffc9d2',gl:'255,95,115'},
 {lit1:'#e0ffe9',lit2:'#23c96d',un:'rgba(86,230,140,0.14)', stU:'rgba(110,235,160,0.80)',stL:'#d2ffe2',gl:'80,230,140'},
 {lit1:'#e4e6ff',lit2:'#5b6cff',un:'rgba(127,141,255,0.16)',stU:'rgba(152,162,255,0.85)',stL:'#dfe1ff',gl:'125,140,255'},
];

const LEVELS=[
 {name:"Erster Strahl", hint:"Tippe auf den Spiegel, um ihn zu kippen – leite den Strahl zum Kristall.",
  w:7,h:5, emitter:{x:0,y:2,d:1},
  mirrors:[{x:5,y:2,o:0}], splitters:[], blocks:[], targets:[{x:5,y:4}]},
 {name:"Doppelte Ecke", hint:"Manchmal braucht man zwei Ecken.",
  w:7,h:6, emitter:{x:0,y:1,d:1},
  mirrors:[{x:3,y:1,o:0},{x:3,y:4,o:0}], splitters:[], blocks:[{x:5,y:1}], targets:[{x:6,y:4}]},
 {name:"Zickzack", hint:"Drei Spiegel, ein Ziel. Geduld!",
  w:8,h:6, emitter:{x:0,y:0,d:1},
  mirrors:[{x:5,y:0,o:0},{x:5,y:3,o:1},{x:2,y:3,o:1}], splitters:[], blocks:[{x:7,y:3}], targets:[{x:2,y:5}]},
 {name:"Die Teilung", hint:"Der Teiler spaltet den Strahl – geradeaus UND um die Ecke. Alle Kristalle müssen leuchten!",
  w:8,h:6, emitter:{x:0,y:2,d:1},
  mirrors:[{x:3,y:0,o:0}], splitters:[{x:3,y:2,o:0}], blocks:[], targets:[{x:7,y:2},{x:0,y:0}]},
 {name:"Kettenreaktion", hint:"Auch ein Teiler kann den Strahl weiterleiten …",
  w:9,h:7, emitter:{x:0,y:3,d:1},
  mirrors:[{x:3,y:5,o:0}], splitters:[{x:3,y:3,o:0},{x:6,y:5,o:1}], blocks:[{x:8,y:3}], targets:[{x:8,y:5},{x:6,y:0}]},
 {name:"Licht von unten", hint:"Drei Kristalle über zwei Teiler. Du schaffst das!",
  w:9,h:7, emitter:{x:4,y:6,d:0},
  mirrors:[{x:1,y:3,o:0}], splitters:[{x:4,y:3,o:0},{x:2,y:3,o:1}], blocks:[{x:7,y:3},{x:6,y:1}], targets:[{x:2,y:6},{x:1,y:0},{x:4,y:0}]},
 {name:"Farbenspiel", hint:"Neu: Farbfilter! Der weiße Strahl wird rot – der rote Kristall braucht rotes Licht.",
  w:8,h:6, emitter:{x:0,y:2,d:1},
  mirrors:[{x:6,y:2,o:0}], splitters:[], blocks:[], filters:[{x:3,y:2,c:1}], portals:[], targets:[{x:6,y:4,c:1}]},
 {name:"Das Portal", hint:"Neu: Portale! Der Strahl tritt mit gleicher Richtung wieder aus dem Zwillings-Portal aus.",
  w:9,h:6, emitter:{x:0,y:1,d:1},
  mirrors:[{x:8,y:4,o:0}], splitters:[{x:7,y:4,o:1}], blocks:[{x:4,y:0},{x:4,y:1},{x:4,y:2},{x:4,y:3}],
  filters:[], portals:[{a:{x:2,y:1},b:{x:6,y:4}}], targets:[{x:7,y:0},{x:8,y:5}]},
 {name:"Doppel-Farbe", hint:"Zwei Farben, zwei Kristalle. Weiß wird zu der Farbe des Filters.",
  w:9,h:7, emitter:{x:0,y:3,d:1},
  mirrors:[{x:2,y:5,o:0}], splitters:[{x:2,y:3,o:0}], blocks:[{x:2,y:0}],
  filters:[{x:4,y:3,c:3},{x:5,y:5,c:1}], portals:[], targets:[{x:8,y:3,c:3},{x:8,y:5,c:1}]},
 {name:"Prisma", hint:"Finale: Rot, grün und blau – bring alle drei Kristalle zum Leuchten!",
  w:9,h:7, emitter:{x:0,y:3,d:1},
  mirrors:[{x:2,y:5,o:0},{x:5,y:0,o:0}], splitters:[{x:2,y:3,o:0},{x:5,y:3,o:1}], blocks:[{x:2,y:1},{x:7,y:0}],
  filters:[{x:7,y:3,c:3},{x:4,y:5,c:2},{x:2,y:0,c:1}], portals:[],
  targets:[{x:8,y:3,c:3},{x:8,y:5,c:2},{x:0,y:0,c:1}]},
];

// ---------- DOM ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const overlay=document.getElementById('overlay');
const elLvlnum=document.getElementById('lvlnum'), elLvlname=document.getElementById('lvlname');
const elMoves=document.getElementById('moves'), elHint=document.getElementById('hint'), elDots=document.getElementById('dots');
const btnUndo=document.getElementById('btnUndo'), btnReset=document.getElementById('btnReset');
const btnHint=document.getElementById('btnHint'), btnMenu=document.getElementById('btnMenu'), btnSound=document.getElementById('btnSound');

// ---------- State ----------
let cur=null, cell=48, pad=14, dpr=1;
let hoverKey=null, parts=[];
const state={ screen:'start', started:false, current:0, maxUnlocked:0,
              stars:new Array(LEVELS.length).fill(0), totalMoves:0 };

// ---------- Sound ----------
let actx=null, soundOn=true;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function beep(f,dur,type,vol,delay){
  if(!soundOn) return; const a=ac(); if(!a) return;
  type=type||'sine'; vol=vol||0.14; delay=delay||0;
  const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime+delay;
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.06);
}
const sTick=()=>{ beep(430,0.09,'triangle',0.11); beep(660,0.06,'triangle',0.07,0.035); };
const sPing=()=>beep(880,0.22,'sine',0.09);
const sWin =()=>[523,659,784,1046].forEach((f,i)=>beep(f,0.4,'sine',0.13,i*0.11));
const sHint=()=>beep(1180,0.18,'sine',0.07);

// ---------- Strahl-Verfolgung (mit Farbe, Filtern, Portalen) ----------
function traceLevel(level, orient){
  const cells=new Map();
  const put=(x,y,v)=>cells.set(x+","+y,v);
  level.blocks.forEach(b=>put(b.x,b.y,{t:'block'}));
  level.targets.forEach(tg=>put(tg.x,tg.y,{t:'target',c:tg.c||0}));
  level.mirrors.forEach(m=>put(m.x,m.y,{t:'mirror', o: orient? orient.get(m.x+","+m.y) : m.o}));
  level.splitters.forEach(s=>put(s.x,s.y,{t:'splitter', o: orient? orient.get(s.x+","+s.y) : s.o}));
  (level.filters||[]).forEach(f=>put(f.x,f.y,{t:'filter',c:f.c}));
  (level.portals||[]).forEach(p=>{
    put(p.a.x,p.a.y,{t:'portal',ox:p.b.x,oy:p.b.y});
    put(p.b.x,p.b.y,{t:'portal',ox:p.a.x,oy:p.a.y});
  });
  put(level.emitter.x,level.emitter.y,{t:'emitter'});

  const beams=[], hitT=new Set(), wrongT=new Set();
  const q=[{x:level.emitter.x,y:level.emitter.y,d:level.emitter.d,col:0}];
  let bg=0;
  while(q.length && bg++<60){
    const st=q.shift();
    let x=st.x, y=st.y, d=st.d, col=st.col;
    const pts=[{x,y}], seen=new Set();
    let guard=0;
    while(guard++<400){
      const dx=DIRS[d].x, dy=DIRS[d].y, nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=level.w||ny>=level.h){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
      const key=nx+","+ny, c=cells.get(key), skey=key+","+d+","+col;
      if(c){
        if(seen.has(skey)){ pts.push({x:nx,y:ny}); break; }
        seen.add(skey);
        if(c.t==='block'){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
        if(c.t==='emitter'){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
        if(c.t==='target'){
          pts.push({x:nx,y:ny});
          if(c.c===0||c.c===col) hitT.add(key); else wrongT.add(key);
          break;
        }
        if(c.t==='filter'){
          if(col===0){ pts.push({x:nx,y:ny}); q.push({x:nx,y:ny,d,col:c.c}); break; }
          if(col===c.c){ pts.push({x:nx,y:ny}); x=nx; y=ny; continue; }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; // falsche Farbe: absorbiert
        }
        if(c.t==='portal'){
          pts.push({x:nx,y:ny});
          pts.push({x:c.ox,y:c.oy});
          x=c.ox; y=c.oy; continue;
        }
        pts.push({x:nx,y:ny});
        if(c.t==='mirror'){ d=refl(d,c.o); x=nx; y=ny; continue; }
        if(c.t==='splitter'){ q.push({x:nx,y:ny,d:refl(d,c.o),col}); x=nx; y=ny; continue; }
      } else {
        if(seen.has(skey)) break;
        seen.add(skey);
        pts.push({x:nx,y:ny}); x=nx; y=ny;
      }
    }
    beams.push({pts,col});
  }
  return {beams,hitT,wrongT};
}

// ---------- Löser: minimale Klicks + nächste Lösung ----------
function solve(level){
  const rots=[].concat(level.mirrors, level.splitters);
  const n=rots.length;
  const start=rots.reduce((a,c,i)=>a|(c.o<<i),0);
  const isWin=m=>{
    const orient=new Map();
    rots.forEach((c,i)=>orient.set(c.x+","+c.y,(m>>i)&1));
    const {hitT}=traceLevel(level,orient);
    return level.targets.every(t=>hitT.has(t.x+","+t.y));
  };
  const dist=new Map([[start,0]]), queue=[start];
  while(queue.length){
    const m=queue.shift(), dd=dist.get(m);
    if(isWin(m)) return {dist:dd, mask:m, rots};
    for(let i=0;i<n;i++){
      const m2=m^(1<<i);
      if(!dist.has(m2)){ dist.set(m2,dd+1); queue.push(m2); }
    }
  }
  return null;
}

// ---------- Level-Verwaltung ----------
function loadLevel(i){
  const src=LEVELS[i];
  cur={
    idx:i, token:{},
    lvl:{ ...src,
      mirrors:src.mirrors.map(m=>({...m})),
      splitters:src.splitters.map(s=>({...s})),
      filters:(src.filters||[]).map(f=>({...f})),
      portals:(src.portals||[]).map(p=>({a:{...p.a},b:{...p.b}})),
      blocks:[...src.blocks], targets:src.targets.map(t=>({...t})), emitter:{...src.emitter} },
    moves:0, won:false, earned:0, litKeys:new Set(), hist:[], hintUntil:0, hintSol:null
  };
  const sol=solve(cur.lvl);
  cur.opt = sol ? sol.dist : 1;
  if(sol){
    const map=new Map();
    sol.rots.forEach((c,k)=>map.set(c.x+","+c.y,(sol.mask>>k)&1));
    cur.hintSol=map;
  }
  cur.vis=new Map();
  [].concat(cur.lvl.mirrors,cur.lvl.splitters).forEach(c=>{
    cur.vis.set(c.x+","+c.y,{a:angOf(c.o), ta:angOf(c.o), flash:0});
  });
  resize();
  retrace(true);
  cur.litKeys=new Set(cur.lvl.targets.filter(t=>cur.trace.hitT.has(t.x+","+t.y)).map(t=>t.x+","+t.y));
  state.current=i;
  updateHUD();
}
function px(gx){ return pad+gx*cell+cell/2; }
function py(gy){ return pad+gy*cell+cell/2; }

function retrace(silent){
  cur.trace=traceLevel(cur.lvl,null);
  const nowKeys=new Set(cur.lvl.targets.filter(t=>cur.trace.hitT.has(t.x+","+t.y)).map(t=>t.x+","+t.y));
  if(!silent){
    nowKeys.forEach(k=>{
      if(!cur.litKeys.has(k)){
        sPing();
        const xy=k.split(',').map(Number);
        burst(px(xy[0]),py(xy[1]),false);
      }
    });
  }
  cur.litKeys=nowKeys;
  if(nowKeys.size===cur.lvl.targets.length && !cur.won) winLevel();
}

function winLevel(){
  cur.won=true;
  cur.earned = cur.moves<=cur.opt ? 3 : cur.moves<=cur.opt+2 ? 2 : 1;
  state.stars[cur.idx]=Math.max(state.stars[cur.idx],cur.earned);
  state.totalMoves+=cur.moves;
  state.maxUnlocked=Math.min(LEVELS.length-1, Math.max(state.maxUnlocked, cur.idx+1));
  sWin();
  cur.lvl.targets.forEach(t=>burst(px(t.x),py(t.y),true));
  const tok=cur.token;
  setTimeout(()=>{ if(cur && cur.token===tok) showWinOverlay(); },950);
}

// ---------- HUD & Overlays ----------
function updateHUD(){
  elLvlnum.textContent=`Level ${cur.idx+1}/${LEVELS.length}`;
  elLvlname.textContent=cur.lvl.name;
  elMoves.textContent=`Züge: ${cur.moves}`;
  elHint.innerHTML=`💡 ${cur.lvl.hint} <span class="opt">· Optimum: ${cur.opt} Züge</span>`;
  elDots.innerHTML=LEVELS.map((_,i)=>{
    let cls='dot';
    if(state.stars[i]>0 && i!==cur.idx) cls+=' done';
    if(i===cur.idx) cls+=' cur';
    return `<span class="${cls}"></span>`;
  }).join('');
}
function showOverlay(html){ overlay.innerHTML=html; overlay.classList.remove('hidden'); }

// ---------- Eingabe ----------
function eventToCell(e){
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const gx=Math.floor((x-pad)/cell), gy=Math.floor((y-pad)/cell);
  if(gx<0||gy<0||gx>=cur.lvl.w||gy>=cur.lvl.h) return null;
  return {gx,gy};
}
function findRot(gx,gy){
  return cur.lvl.mirrors.find(c=>c.x===gx&&c.y===gy) ||
         cur.lvl.splitters.find(c=>c.x===gx&&c.y===gy) || null;
}
cv.addEventListener('pointerdown',e=>{
  if(!cur || cur.won || state.screen!=='play') return;
  const pos=eventToCell(e); if(!pos) return;
  const c=findRot(pos.gx,pos.gy); if(!c) return;
  cur.hist.push({x:c.x,y:c.y,o:c.o});
  if(cur.hist.length>200) cur.hist.shift();
  c.o^=1;
  const v=cur.vis.get(c.x+","+c.y);
  v.ta=angOf(c.o); v.flash=performance.now();
  cur.moves++;
  sTick();
  retrace(false);
  updateHUD();
});
cv.addEventListener('mousemove',e=>{
  if(!cur) return;
  const pos=eventToCell(e);
  hoverKey=(pos && findRot(pos.gx,pos.gy)) ? pos.gx+","+pos.gy : null;
  cv.style.cursor=hoverKey?'pointer':'default';
});
cv.addEventListener('mouseleave',()=>{ hoverKey=null; });

btnUndo.addEventListener('click',()=>{
  if(!cur||cur.won||state.screen!=='play'||!cur.hist.length) return;
  const h=cur.hist.pop();
  const c=findRot(h.x,h.y); if(!c) return;
  c.o=h.o;
  const v=cur.vis.get(h.x+","+h.y); if(v) v.ta=angOf(h.o);
  cur.moves=Math.max(0,cur.moves-1);
  beep(340,0.08,'triangle',0.08);
  retrace(true);
  updateHUD();
});
btnReset.addEventListener('click',()=>{
  if(cur&&state.screen==='play'){ loadLevel(cur.idx); beep(300,0.1,'triangle',0.08); }
});
btnHint.addEventListener('click',()=>{
  if(!cur||cur.won||!cur.hintSol||state.screen!=='play') return;
  cur.hintUntil=performance.now()+2800;
  sHint();
});
btnMenu.addEventListener('click',()=>{ if(state.screen==='play'||state.screen==='select') showSelect(); });
btnSound.addEventListener('click',()=>{
  soundOn=!soundOn; btnSound.textContent=soundOn?'🔊':'🔇';
  if(soundOn){ ac(); beep(660,0.12,'sine',0.1); }
});

// ---------- Partikel ----------
const PCOLS=['#ffd76a','#7fe8ff','#ffffff','#ff9df0','#9dff9d'];
function burst(x,y,big){
  const n=big?44:10;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(big?2.1:1.1)*(0.4+Math.random())*cell*0.045;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(big?cell*0.05:0),
      life:1, decay:0.9+Math.random()*0.9,
      col:PCOLS[(Math.random()*PCOLS.length)|0]});
  }
  if(parts.length>460) parts.splice(0,parts.length-460);
}

// ---------- Zeichnen ----------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function resize(){
  if(!cur) return;
  const stageW=document.getElementById('stage').clientWidth;
  const availH=Math.max(260, Math.min(window.innerHeight*0.62, 540));
  cell=Math.max(24, Math.floor(Math.min((stageW-20)/cur.lvl.w,(availH-20)/cur.lvl.h)));
  pad=Math.max(10, Math.round(cell*0.3));
  const cw=cell*cur.lvl.w+pad*2, ch=cell*cur.lvl.h+pad*2;
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
}
window.addEventListener('resize',resize);

function poly(P){ ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for(let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y); }

function drawBeams(t){
  const tr=cur.trace; if(!tr) return;
  ctx.lineCap='round'; ctx.lineJoin='round';
  tr.beams.forEach(bm=>{
    const pts=bm.pts; if(pts.length<2) return;
    const P=pts.map(p=>({x:px(p.x),y:py(p.y)}));
    const [r,g,b]=BEAMRGB[bm.col];
    ctx.strokeStyle=`rgba(${r},${g},${b},0.10)`; ctx.lineWidth=cell*0.30; poly(P); ctx.stroke();
    ctx.strokeStyle=`rgba(${r},${g},${b},0.30)`; ctx.lineWidth=cell*0.16; poly(P); ctx.stroke();
    ctx.strokeStyle=BEAMCORE[bm.col]; ctx.lineWidth=Math.max(2,cell*0.06); poly(P); ctx.stroke();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.85)';
    ctx.lineWidth=Math.max(1.5,cell*0.042);
    ctx.setLineDash([cell*0.10,cell*0.52]);
    ctx.lineDashOffset=-((t*0.001*cell*3)%(cell*0.62));
    poly(P); ctx.stroke();
    ctx.restore();
  });
  const e=cur.lvl.emitter, ex=px(e.x)+DIRS[e.d].x*cell*0.4, ey=py(e.y)+DIRS[e.d].y*cell*0.4;
  const g=ctx.createRadialGradient(ex,ey,0,ex,ey,cell*0.4);
  g.addColorStop(0,'rgba(190,240,255,0.7)'); g.addColorStop(1,'rgba(190,240,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,cell*0.4,0,Math.PI*2); ctx.fill();
}
function drawEmitter(t){
  const e=cur.lvl.emitter, cx=px(e.x), cy=py(e.y), s=cell;
  const g=ctx.createLinearGradient(cx,cy-s/2,cx,cy+s/2);
  g.addColorStop(0,'#2b2115'); g.addColorStop(1,'#1b1409');
  ctx.fillStyle=g; rr(cx-s*0.4,cy-s*0.4,s*0.8,s*0.8,s*0.16); ctx.fill();
  ctx.strokeStyle='rgba(255,180,94,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  const d=DIRS[e.d], pxp=-d.y, pyp=d.x;
  ctx.fillStyle='#ffc46b';
  ctx.beginPath();
  ctx.moveTo(cx+d.x*s*0.3, cy+d.y*s*0.3);
  ctx.lineTo(cx-d.x*s*0.08+pxp*s*0.17, cy-d.y*s*0.08+pyp*s*0.17);
  ctx.lineTo(cx-d.x*s*0.08-pxp*s*0.17, cy-d.y*s*0.08-pyp*s*0.17);
  ctx.closePath(); ctx.fill();
  const pulse=0.5+0.5*Math.sin(t*0.005);
  ctx.fillStyle=`rgba(255,220,160,${0.5+0.5*pulse})`;
  ctx.beginPath(); ctx.arc(cx,cy,s*0.08,0,Math.PI*2); ctx.fill();
}
function drawBlock(b){
  const cx=px(b.x), cy=py(b.y), s=cell;
  const g=ctx.createLinearGradient(cx,cy-s/2,cx,cy+s/2);
  g.addColorStop(0,'#212c44'); g.addColorStop(1,'#141b2c');
  ctx.fillStyle=g; rr(cx-s*0.4,cy-s*0.4,s*0.8,s*0.8,s*0.14); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx-s*0.3,cy-s*0.32); ctx.lineTo(cx+s*0.3,cy-s*0.32); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.10)';
  [[-0.26,-0.26],[0.26,-0.26],[-0.26,0.26],[0.26,0.26]].forEach(o=>{
    ctx.beginPath(); ctx.arc(cx+o[0]*s,cy+o[1]*s,s*0.035,0,Math.PI*2); ctx.fill();
  });
}
function drawFilter(f){
  const cx=px(f.x), cy=py(f.y), s=cell, rgb=BEAMRGB[f.c];
  ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.20)`;
  rr(cx-s*0.38,cy-s*0.38,s*0.76,s*0.76,s*0.14); ctx.fill();
  ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.85)`; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(cx,cy-s*0.18); ctx.lineTo(cx+s*0.16,cy+s*0.13); ctx.lineTo(cx-s*0.16,cy+s*0.13);
  ctx.closePath(); ctx.stroke();
}
function drawPortalCell(x,y,t){
  const cx=px(x), cy=py(y), r=cell*0.30;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.5);
  g.addColorStop(0,'rgba(190,120,255,0.45)'); g.addColorStop(1,'rgba(190,120,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#150b26'; ctx.beginPath(); ctx.arc(cx,cy,r*0.72,0,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.strokeStyle='rgba(210,150,255,0.9)'; ctx.lineWidth=2.2;
  ctx.setLineDash([cell*0.14,cell*0.11]); ctx.lineDashOffset=-t*0.02;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([cell*0.07,cell*0.09]); ctx.lineDashOffset=t*0.03;
  ctx.strokeStyle='rgba(240,200,255,0.7)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(cx,cy,r*0.45,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawTarget(tg,t){
  const key=tg.x+","+tg.y;
  const lit=cur.trace && cur.trace.hitT.has(key);
  const wrong=cur.trace && cur.trace.wrongT.has(key);
  const tc=TCOL[tg.c||0];
  const cx=px(tg.x), cy=py(tg.y);
  const pulse=lit?1+0.07*Math.sin(t*0.006):1;
  const r=cell*0.26*pulse;
  if(lit){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*3.2);
    g.addColorStop(0,`rgba(${tc.gl},0.42)`); g.addColorStop(1,`rgba(${tc.gl},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*3.2,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.strokeStyle=`rgba(${tc.gl},0.5)`; ctx.lineWidth=1.5;
    for(let i=0;i<4;i++){
      const a=t*0.001+i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r*1.35, cy+Math.sin(a)*r*1.35);
      ctx.lineTo(cx+Math.cos(a)*r*1.85, cy+Math.sin(a)*r*1.85);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.beginPath();
  ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath();
  if(lit){
    const g2=ctx.createLinearGradient(cx,cy-r,cx,cy+r);
    g2.addColorStop(0,tc.lit1); g2.addColorStop(1,tc.lit2);
    ctx.fillStyle=g2; ctx.fill();
    ctx.strokeStyle=tc.stL;
  } else {
    ctx.fillStyle=tc.un; ctx.fill();
    ctx.strokeStyle=tc.stU;
  }
  ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx,cy-r); ctx.lineTo(cx,cy+r);
  ctx.moveTo(cx-r,cy); ctx.lineTo(cx+r,cy);
  ctx.strokeStyle=lit?'rgba(255,255,255,0.5)':tc.stU.replace(/0\.\d+\)$/,'0.3)');
  ctx.lineWidth=1; ctx.stroke();
  if(wrong && !lit){
    ctx.strokeStyle='rgba(255,120,120,0.85)'; ctx.lineWidth=2;
    const k=cell*0.12;
    ctx.beginPath();
    ctx.moveTo(cx-k,cy-k); ctx.lineTo(cx+k,cy+k);
    ctx.moveTo(cx+k,cy-k); ctx.lineTo(cx-k,cy+k);
    ctx.stroke();
  }
}
function drawRotatable(c,isSplit,t,dt){
  const v=cur.vis.get(c.x+","+c.y);
  v.a+=(v.ta-v.a)*Math.min(1,dt/70);
  const cx=px(c.x), cy=py(c.y), key=c.x+","+c.y;
  ctx.fillStyle='rgba(255,255,255,0.035)';
  ctx.beginPath(); ctx.arc(cx,cy,cell*0.35,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.stroke();
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(v.a);
  const L=cell*0.66, th=cell*0.14;
  if(isSplit){
    ctx.fillStyle='rgba(140,230,255,0.28)';
    rr(-L/2,-th/2,L,th,th/2); ctx.fill();
    ctx.strokeStyle='rgba(170,240,255,0.7)'; ctx.lineWidth=1.5; ctx.stroke();
  } else {
    const g=ctx.createLinearGradient(-L/2,0,L/2,0);
    g.addColorStop(0,'#7f93a8'); g.addColorStop(0.5,'#eaf7ff'); g.addColorStop(1,'#7f93a8');
    ctx.fillStyle=g; rr(-L/2,-th/2,L,th,th/2); ctx.fill();
    ctx.strokeStyle='rgba(20,30,50,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=Math.max(1.2,cell*0.02);
    ctx.beginPath(); ctx.moveTo(-L/2+4,-th*0.26); ctx.lineTo(L/2-4,-th*0.26); ctx.stroke();
  }
  ctx.restore();
  if(isSplit){
    ctx.save();
    ctx.shadowColor='#9feaff'; ctx.shadowBlur=8;
    ctx.fillStyle='#bdf1ff';
    ctx.beginPath();
    ctx.moveTo(cx,cy-cell*0.09); ctx.lineTo(cx+cell*0.09,cy); ctx.lineTo(cx,cy+cell*0.09); ctx.lineTo(cx-cell*0.09,cy);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // Hinweis-Geist
  if(cur.hintUntil>t && cur.hintSol){
    const so=cur.hintSol.get(key);
    if(so!==undefined && so!==c.o){
      const blink=0.25+0.2*Math.sin(t*0.012);
      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(angOf(so));
      ctx.fillStyle=`rgba(160,240,255,${blink*0.35})`;
      ctx.strokeStyle=`rgba(160,240,255,${blink+0.3})`;
      ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
      rr(-L/2,-th/2,L,th,th/2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  const age=performance.now()-v.flash;
  if(age<380){
    const k=age/380;
    ctx.strokeStyle=`rgba(140,230,255,${0.5*(1-k)})`;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,cell*(0.2+0.45*k),0,Math.PI*2); ctx.stroke();
  }
  if(hoverKey===key && !cur.won && state.screen==='play'){
    ctx.strokeStyle='rgba(140,230,255,0.55)'; ctx.lineWidth=2;
    rr(px(c.x)-cell*0.46,py(c.y)-cell*0.46,cell*0.92,cell*0.92,cell*0.14); ctx.stroke();
  }
}

let lastT=performance.now();
function render(t){
  requestAnimationFrame(render);
  const dt=Math.min(50,t-lastT); lastT=t;
  if(!cur) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cw=cell*cur.lvl.w+pad*2, ch=cell*cur.lvl.h+pad*2;
  ctx.clearRect(0,0,cw,ch);
  const bg=ctx.createLinearGradient(0,0,0,ch);
  bg.addColorStop(0,'#0f1a30'); bg.addColorStop(1,'#0a1120');
  ctx.fillStyle=bg; rr(1,1,cw-2,ch-2,15); ctx.fill();
  ctx.strokeStyle='rgba(140,180,255,0.15)'; ctx.lineWidth=1; ctx.stroke();
  for(let gy=0;gy<cur.lvl.h;gy++) for(let gx=0;gx<cur.lvl.w;gx++){
    if((gx+gy)%2===0){ ctx.fillStyle='rgba(255,255,255,0.016)'; ctx.fillRect(pad+gx*cell,pad+gy*cell,cell,cell); }
  }
  ctx.strokeStyle='rgba(148,180,255,0.07)'; ctx.lineWidth=1;
  for(let i=0;i<=cur.lvl.w;i++){ ctx.beginPath(); ctx.moveTo(pad+i*cell,pad); ctx.lineTo(pad+i*cell,pad+cur.lvl.h*cell); ctx.stroke(); }
  for(let j=0;j<=cur.lvl.h;j++){ ctx.beginPath(); ctx.moveTo(pad,pad+j*cell); ctx.lineTo(pad+cur.lvl.w*cell,pad+j*cell); ctx.stroke(); }
  // Portal-Verbindungen
  (cur.lvl.portals||[]).forEach(p=>{
    ctx.save();
    ctx.strokeStyle='rgba(200,150,255,0.20)'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,9]); ctx.lineDashOffset=-t*0.015;
    ctx.beginPath(); ctx.moveTo(px(p.a.x),py(p.a.y)); ctx.lineTo(px(p.b.x),py(p.b.y)); ctx.stroke();
    ctx.restore();
  });
  cur.lvl.blocks.forEach(drawBlock);
  (cur.lvl.filters||[]).forEach(drawFilter);
  drawEmitter(t);
  (cur.lvl.portals||[]).forEach(p=>{ drawPortalCell(p.a.x,p.a.y,t); drawPortalCell(p.b.x,p.b.y,t); });
  cur.lvl.mirrors.forEach(m=>drawRotatable(m,false,t,dt));
  cur.lvl.splitters.forEach(s=>drawRotatable(s,true,t,dt));
  drawBeams(t);
  cur.lvl.targets.forEach(tg=>drawTarget(tg,t));
  // Partikel
  const dtN=dt/16.7;
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=cell*0.0035*dtN;
    p.x+=p.vx*dtN; p.y+=p.vy*dtN; p.life-=0.02*p.decay*dtN;
    if(p.life<=0) return;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.8,cell*0.045*p.life+0.8),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ---------- Start ----------
loadLevel(0);
showStartOverlay();
requestAnimationFrame(render);
})();
</script>
