<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Lichtpfad ✦ Das Licht-Rätsel</title>
<style>
  :root{ --cyan:#5fe0ff; --gold:#ffd76a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ font-size:17px; }
  body{
    margin:0; min-height:100dvh; color:#dbe7ff; user-select:none; font-size:1rem;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 15% -10%, #14203c 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 20%, #1a1230 0%, transparent 55%),
      linear-gradient(180deg,#070b14,#05070d);
    display:flex; justify-content:center;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.7;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 28% 68%, rgba(180,220,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 44% 12%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 63% 41%, rgba(200,180,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 78% 76%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 90% 18%, rgba(160,230,255,.6), transparent),
      radial-gradient(1px 1px at 8% 88%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 55% 90%, rgba(190,200,255,.5), transparent);
    animation:twk 7s ease-in-out infinite alternate;
  }
  @keyframes twk{ from{opacity:.45} to{opacity:.9} }
  #app{ width:100%; max-width:760px; padding:10px 12px 26px; position:relative; z-index:1; }
  header{ text-align:center; padding:6px 0 2px; }
  header h1{
    margin:0; font-size:clamp(1.6rem,5.5vw,2.2rem); font-weight:800; letter-spacing:.34em; padding-left:.34em;
    background:linear-gradient(90deg,#7fe8ff,#c9b2ff 55%,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(127,232,255,.35));
  }
  header p{ margin:3px 0 0; color:#7f93b8; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    margin:10px 0 8px; padding:10px 12px; border-radius:14px;
    background:rgba(255,255,255,.045); border:1px solid rgba(140,180,255,.14);
  }
  #lvlinfo{ display:flex; flex-direction:column; min-width:120px; }
  #lvlnum{ font-size:.78rem; letter-spacing:.14em; color:#7f93b8; text-transform:uppercase; }
  #lvlname{ font-size:1.15rem; font-weight:700; color:#eaf3ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tb-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #moves{ font-size:.95rem; color:#a9bce0; margin-right:2px; white-space:nowrap; }
  .iconbtn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    color:#cfe6ff; width:2.5rem; height:2.5rem; border-radius:12px; cursor:pointer; font-size:1.15rem; line-height:1; padding:0;
  }
  .iconbtn:hover{ background:rgba(255,255,255,.12); }
  #dots{ display:flex; gap:4px; margin:0 4px; flex-wrap:wrap; max-width:170px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#2a3450; border:1px solid #3b4a72; }
  .dot.done{ background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 8px rgba(95,224,255,.7); }
  .dot.cur{ border-color:#c9b2ff; box-shadow:0 0 0 3px rgba(201,178,255,.22); }
  #stage{ position:relative; display:flex; justify-content:center; }
  canvas{ touch-action:none; border-radius:16px; display:block; }
  #hint{ text-align:center; color:#9db1d6; font-size:1rem; min-height:1.5rem; margin:10px 4px 0; }
  #hint .opt{ color:#66799f; }
  #overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:12px;
    background:rgba(5,8,16,.78); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    z-index:50;
  }
  .hidden{ display:none !important; }
  .panel{
    background:linear-gradient(180deg,#111c33,#0b1222);
    border:1px solid rgba(130,180,255,.22); border-radius:18px;
    padding:1.5rem 1.6rem; text-align:center; max-width:96%; width:480px; max-height:94dvh; overflow:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .panel .big{ font-size:1.55rem; font-weight:800; letter-spacing:.1em; color:#eaf3ff; }
  .panel .big.brand{
    font-size:clamp(1.6rem,6vw,2.1rem); letter-spacing:.26em; padding-left:.26em;
    background:linear-gradient(90deg,#7fe8ff,#c9b2ff 55%,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .panel .sub{ color:#8fa3c8; font-size:.95rem; margin:8px 0 0; }
  .menu{ display:flex; flex-direction:column; gap:9px; margin:16px 0 4px; }
  .mbtn{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    background:rgba(255,255,255,.055); border:1px solid rgba(140,180,255,.18); color:#eaf3ff;
    border-radius:13px; padding:.85rem 1.05rem; font-size:1.05rem; font-weight:700; cursor:pointer;
    font-family:inherit; text-align:left;
  }
  .mbtn:hover{ background:rgba(255,255,255,.11); border-color:rgba(140,200,255,.42); }
  .mbtn span{ font-size:.8rem; color:#8fa3c8; font-weight:500; text-align:right; flex-shrink:0; }
  .csec{ margin-top:12px; font-size:.8rem; color:#7f93b8; letter-spacing:.1em; text-transform:uppercase; }
  .crow{ display:flex; gap:8px; margin-top:7px; }
  .crow .mbtn{ flex:1; padding:9px 14px; font-size:.95rem; }
  .cdel{ background:rgba(255,90,110,.12); border:1px solid rgba(255,90,110,.35); color:#ff9daa; width:44px; border-radius:13px; cursor:pointer; font-size:1rem; }
  .rules{ list-style:none; padding:0; margin:14px 0 4px; text-align:left; display:inline-block; }
  .rules li{ margin:8px 0; font-size:.92rem; color:#9fb2d4; max-width:420px; }
  .btn{
    background:linear-gradient(180deg,#3fdcff,#0ea5d8); color:#04202c; font-weight:800;
    border:none; padding:.8rem 1.6rem; border-radius:999px; cursor:pointer; font-size:1.05rem;
    box-shadow:0 6px 20px rgba(40,200,255,.35); letter-spacing:.03em;
  }
  .btn:hover{ filter:brightness(1.12); }
  .btn.ghost{ background:rgba(255,255,255,.08); color:#cfe6ff; box-shadow:none; border:1px solid rgba(255,255,255,.2); font-weight:600; }
  .btnrow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .stars{ margin:14px 0 4px; }
  .stars span{ display:inline-block; font-size:2.7rem; color:#39415a; margin:0 5px; }
  .stars span.on{ color:var(--gold); text-shadow:0 0 18px rgba(255,205,90,.75); animation:pop .55s backwards; }
  @keyframes pop{ 0%{transform:scale(0) rotate(-40deg);opacity:0} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .stat{ color:#a9bce0; font-size:1rem; margin:6px 0 18px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; margin-top:16px; }
  .card{
    background:rgba(255,255,255,.05); border:1px solid rgba(140,180,255,.18); border-radius:12px;
    padding:11px 6px 10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; align-items:center;
    color:#dbe7ff; font-family:inherit;
  }
  .card:hover{ background:rgba(255,255,255,.11); }
  .card.cur{ border-color:#7fe8ff; box-shadow:0 0 0 2px rgba(127,232,255,.25); }
  .card.locked{ opacity:.42; cursor:default; }
  .cnum{ font-weight:800; font-size:1.2rem; color:#7fe8ff; }
  .cname{ font-size:.8rem; color:#a9bce0; white-space:nowrap; overflow:hidden; max-width:100%; text-overflow:ellipsis; }
  .cstars{ font-size:.8rem; color:#ffd76a; letter-spacing:1px; }
  .ta{
    width:100%; min-height:6.5rem; margin:12px 0; background:#0a1122; color:#bfe9ff;
    border:1px solid rgba(140,180,255,.25); border-radius:12px; padding:10px; font-size:.85rem;
    font-family:ui-monospace,Menlo,Consolas,monospace; resize:vertical;
  }
  #edbar{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .edrow{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .chip{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); color:#cfe6ff;
    border-radius:999px; padding:9px 14px; font-size:.92rem; cursor:pointer; font-family:inherit;
  }
  .chip:hover{ background:rgba(255,255,255,.12); }
  .chip.active{ border-color:#7fe8ff; background:rgba(127,232,255,.16); color:#eaffff; box-shadow:0 0 10px rgba(127,232,255,.3); }
  #edMsg{ text-align:center; font-size:.92rem; color:#8fa3c8; min-height:1.2rem; }
  @media (max-width:640px){
    html{ font-size:18px; }
    header h1{ letter-spacing:.2em; padding-left:.2em; }
    #app{ padding:6px 8px 20px; }
    .iconbtn{ width:2.7rem; height:2.7rem; font-size:1.25rem; }
    #lvlname{ font-size:1.25rem; }
    #lvlnum{ font-size:.82rem; }
    #moves{ font-size:1rem; }
    #hint{ font-size:1.02rem; }
    .panel{ padding:1.2rem 1rem; }
    .mbtn{ font-size:1.1rem; }
    .mbtn span{ font-size:.82rem; }
    .rules li{ font-size:.98rem; }
    .chip{ font-size:.98rem; padding:10px 15px; }
    .stat{ font-size:1.05rem; }
    .btn{ font-size:1.1rem; }
    #edMsg{ font-size:.98rem; }
    .cstars{ font-size:.85rem; }
    .cname{ font-size:.85rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✦ LICHTPFAD ✦</h1>
    <p>Das Licht-Rätsel · 20 Level · Editor · Codes · Tagesrätsel</p>

      <button class="iconbtn" id="btnUndo"  title="Zug rückgängig">↩</button>
      <button class="iconbtn" id="btnReset" title="Zurücksetzen">⟳</button>
      <button class="iconbtn" id="btnHint"  title="Lösung kurz anzeigen">💡</button>
      <button class="iconbtn" id="btnAuto"  title="Automatisch lösen">🤖</button>
      <button class="iconbtn" id="btnMenu"  title="Menü">⊞</button>
      <button class="iconbtn" id="btnSound" title="Effekte an/aus">🔊</button>
      <button class="iconbtn" id="btnMusic" title="Musik an/aus">🎵</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
  </div>
  <p id="hint"></p>
  <div id="edbar" class="hidden">
    <div class="edrow" id="palette"></div>
    <div class="edrow">
      <button class="chip" id="edSize">📐 8×6</button>
      <button class="chip" id="edCheck">🧪 Lösbar?</button>

      <button class="chip" id="edClear">🗑 Leer</button>
      <button class="chip" id="edExit">← Fertig</button>
    </div>
    <div id="edMsg"></div>
  </div>
  <div id="overlay"></div>
</div>

function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

function beep(f,dur,type,vol,delay){
  if(!soundOn) return; const a=ac(); if(!a) return;
  type=type||'sine'; vol=vol||0.14; delay=delay||0;
  try{
    const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime+delay;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.06);
  }catch(e){}
}

// ================= Audio: BGM =================
let musicOn=true, mNodes=null, mTimer=null, mStep=0, mNext=0;
const CHORDS=[[57,60,64],[53,57,60],[52,55,59],[55,59,62]];
const BASSR=[45,41,40,43];
const PENTA=[69,72,74,76,79,81,84];
function mFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function startMusic(){
  if(!musicOn||mNodes) return; const a=ac(); if(!a) return;
  try{
    const master=a.createGain(); master.gain.value=0.0001; master.connect(a.destination);
    master.gain.linearRampToValueAtTime(0.55,a.currentTime+2.5);
    const delay=a.createDelay(2); delay.delayTime.value=0.59;
    const fb=a.createGain(); fb.gain.value=0.32; delay.connect(fb); fb.connect(delay);
    const wet=a.createGain(); wet.gain.value=0.4; delay.connect(wet); wet.connect(master);
    mNodes={a,master,delay};
    mNext=a.currentTime+0.1; mStep=0;
    mTimer=setInterval(mSchedule,120);
  }catch(e){}
}
function mSchedule(){
  if(!mNodes) return;
  const a=mNodes.a;
  const spb=60/76/2;
  while(mNext<a.currentTime+0.35){
    mPlayStep(mStep,mNext,spb);
    mNext+=spb; mStep=(mStep+1)%64;
  }
}
function mPlayStep(step,t,spb){
  const {master,delay,a}=mNodes;
  const bar=Math.floor(step/8)%4, inBar=step%8, ch=CHORDS[bar];
  if(inBar===0){
    ch.forEach(m=>mPad(mFreq(m),t,spb*8,master,a));
    mBass(mFreq(BASSR[bar]),t,spb*8,master,a);
  }
  if(inBar%2===0 && Math.random()<0.5){
    const pool=[ch[0]+12,ch[1]+12,ch[2]+12].concat(PENTA);
    mPluck(mFreq(pool[(Math.random()*pool.length)|0]),t,master,delay,a);
  }
}
function mPad(f,t,dur,master,a){
  const o=a.createOscillator(); o.type='sine'; o.frequency.value=f;
  const o2=a.createOscillator(); o2.type='triangle'; o2.frequency.value=f*1.006;
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.032,t+dur*0.3);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g); o2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t+dur+0.1); o2.stop(t+dur+0.1);
}
function mBass(f,t,dur,master,a){
  const o=a.createOscillator(); o.type='triangle'; o.frequency.value=f;
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.055,t+0.06);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1);
}
function mPluck(f,t,master,delay,a){
  const o=a.createOscillator(); o.type='sine'; o.frequency.value=f;
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.065,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.connect(g); g.connect(master); g.connect(delay);
  o.start(t); o.stop(t+0.6);
}
function stopMusic(){
  if(mTimer){ clearInterval(mTimer); mTimer=null; }
  if(mNodes){
    const n=mNodes;
    try{ n.master.gain.cancelScheduledValues(0); n.master.gain.setTargetAtTime(0,n.a.currentTime,0.25); }catch(e){}
    setTimeout(()=>{ try{ n.master.disconnect(); }catch(e){} },800);
    mNodes=null;
  }
}
function ensureAudio(){ ac(); if(musicOn) startMusic(); }

// ================= Strahl-Verfolgung =================
function traceLevel(level, orient){
  const cells=new Map();
  const put=(x,y,v)=>cells.set(x+","+y,v);
  (level.blocks||[]).forEach(b=>put(b.x,b.y,{t:'block'}));
  (level.targets||[]).forEach(tg=>put(tg.x,tg.y,{t:'target',c:tg.c||0}));
  (level.mirrors||[]).forEach(m=>put(m.x,m.y,{t:'mirror', o: orient? orient.get(m.x+","+m.y) : m.o}));
  (level.splitters||[]).forEach(s=>put(s.x,s.y,{t:'splitter', o: orient? orient.get(s.x+","+s.y) : s.o}));
  (level.prism||[]).forEach(p=>put(p.x,p.y,{t:'prism', o: orient? orient.get(p.x+","+p.y) : p.o}));
  (level.movables||[]).forEach(m=>put(m.x,m.y,{t:'mirror', o: orient? (orient.has(m.x+","+m.y)?orient.get(m.x+","+m.y):m.o) : m.o}));
  (level.filters||[]).forEach(f=>put(f.x,f.y,{t:'filter',c:f.c}));
  (level.gates||[]).forEach(g=>put(g.x,g.y,{t:'gate',d:g.d}));
  (level.portals||[]).forEach(p=>{
    put(p.a.x,p.a.y,{t:'portal',ox:p.b.x,oy:p.b.y});
    put(p.b.x,p.b.y,{t:'portal',ox:p.a.x,oy:p.a.y});
  });
  put(level.emitter.x,level.emitter.y,{t:'emitter'});

  const beams=[], hits=new Map(), wrongT=new Set();
  const q=[{x:level.emitter.x,y:level.emitter.y,d:level.emitter.d,col:0}];
  let bg=0;
  while(q.length && bg++<80){
    const st=q.shift();
    let x=st.x, y=st.y, d=st.d, col=st.col;
    const pts=[{x,y}], seen=new Set();
    let guard=0;
    while(guard++<400){
      const dx=DIRS[d].x, dy=DIRS[d].y, nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=level.w||ny>=level.h){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
      const key=nx+","+ny, c=cells.get(key), skey=key+","+d+","+col;
      if(c){
        if(seen.has(skey)){ pts.push({x:nx,y:ny}); break; }
        seen.add(skey);
        if(c.t==='block'||c.t==='emitter'){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
        if(c.t==='gate'){
          if(d===c.d){ pts.push({x:nx,y:ny}); x=nx; y=ny; continue; }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break;
        }
        if(c.t==='target'){
          pts.push({x:nx,y:ny});
          let s=hits.get(key); if(!s){ s=new Set(); hits.set(key,s); }
          s.add(col);
          if(c.c>=1&&c.c<=3&&col!==c.c) wrongT.add(key);
          break;
        }
        if(c.t==='filter'){
          if(col===0){ pts.push({x:nx,y:ny}); q.push({x:nx,y:ny,d,col:c.c}); break; }
          if(col===c.c){ pts.push({x:nx,y:ny}); x=nx; y=ny; continue; }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break;
        }
        if(c.t==='portal'){
          pts.push({x:nx,y:ny});
          pts.push({x:c.ox,y:c.oy});
          x=c.ox; y=c.oy; continue;
        }
        if(c.t==='prism'){
          if(col===0){
            pts.push({x:nx,y:ny});
            q.push({x:nx,y:ny,d,               col:1});
            q.push({x:nx,y:ny,d:refl(d,c.o),   col:2});
            q.push({x:nx,y:ny,d:refl(d,1-c.o), col:3});
            break;
          }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break;
        }
        pts.push({x:nx,y:ny});
        if(c.t==='mirror'){ d=refl(d,c.o); x=nx; y=ny; continue; }
        if(c.t==='splitter'){ q.push({x:nx,y:ny,d:refl(d,c.o),col}); x=nx; y=ny; continue; }
      } else {
        if(seen.has(skey)) break;
        seen.add(skey);
        pts.push({x:nx,y:ny}); x=nx; y=ny;
      }
    }
    beams.push({pts,col});
  }
  return {beams,hits,wrongT};
}
function litTargets(level,trace){
  return new Set(level.targets.filter(tg=>{
    const s=trace.hits.get(tg.x+","+tg.y);
    if(!s||!s.size) return false;
    if(tg.c===0) return true;
    if(MIXREQ[tg.c]) return MIXREQ[tg.c].every(cc=>s.has(cc));
    return s.has(tg.c);
  }).map(tg=>tg.x+","+tg.y));
}
function evalWin(level,trace){ return litTargets(level,trace).size===level.targets.length; }

// ================= Löser =================
function solve(level){
  const rots=getRots(level);
  const movs=(level.movables||[]).map(m=>({...m}));
  if(rots.length+movs.length>14) return null;
  const occ=new Set();
  (level.blocks||[]).forEach(b=>occ.add(b.x+","+b.y));
  (level.targets||[]).forEach(t=>occ.add(t.x+","+t.y));
  (level.filters||[]).forEach(f=>occ.add(f.x+","+f.y));
  (level.gates||[]).forEach(g=>occ.add(g.x+","+g.y));
  (level.portals||[]).forEach(p=>{occ.add(p.a.x+","+p.a.y);occ.add(p.b.x+","+p.b.y);});
  rots.forEach(r=>occ.add(r.x+","+r.y));
  occ.add(level.emitter.x+","+level.emitter.y);
  const nR=rots.length;
  const enc=(mask,mv)=>mask+"|"+mv.map(m=>m.x+","+m.y+","+m.o).join(";");
  const startKey=enc(0,movs);
  const dist=new Map([[startKey,0]]);
  const queue=[{mask:0,movs,key:startKey}];
  let head=0;
  while(head<queue.length){
    if(head>60000) return null;
    const st=queue[head++], dd=dist.get(st.key);
    const orient=new Map();
    rots.forEach((c,i)=>orient.set(c.x+","+c.y,(st.mask>>i)&1));
    st.movs.forEach(m=>orient.set(m.x+","+m.y,m.o));
    const tr=traceLevel({...level,movables:st.movs},orient);
    if(evalWin(level,tr)) return {dist:dd, mask:st.mask, rots, movs:st.movs.map(m=>({...m}))};
    const push=(mask2,mv2)=>{ const k=enc(mask2,mv2); if(!dist.has(k)){ dist.set(k,dd+1); queue.push({mask:mask2,movs:mv2,key:k}); } };
    for(let i=0;i<nR;i++) push(st.mask^(1<<i), st.movs);
    st.movs.forEach((m,mi)=>{
      push(st.mask, st.movs.map((mm,i)=>i===mi?{...mm,o:mm.o^1}:mm));
      DIRS.forEach(dd2=>{
        const nx=m.x+dd2.x, ny=m.y+dd2.y;
        if(nx<0||ny<0||nx>=level.w||ny>=level.h) return;
        if(occ.has(nx+","+ny)) return;
        if(st.movs.some((mm,i)=>i!==mi&&mm.x===nx&&mm.y===ny)) return;
        push(st.mask, st.movs.map((mm,i)=>i===mi?{...mm,x:nx,y:ny}:mm));
      });
    });
  }
  return null;
}

// ================= Level-Laufzeit =================
function startLevel(levelObj, mode, meta){
  const src=levelObj;
  const lvl={
    w:src.w, h:src.h,
    emitter:{...src.emitter},
    mirrors:(src.mirrors||[]).map(m=>({...m})),
    splitters:(src.splitters||[]).map(s=>({...s})),
    prism:(src.prism||[]).map(p=>({...p})),
    movables:(src.movables||[]).map(m=>({...m})),
    filters:(src.filters||[]).map(f=>({...f})),
    gates:(src.gates||[]).map(g=>({...g})),
    portals:(src.portals||[]).map(p=>({a:{...p.a},b:{...p.b}})),
    blocks:(src.blocks||[]).map(b=>({...b})),
    targets:(src.targets||[]).map(t=>({...t})),
    name:src.name||'Rätsel', hint:src.hint||''
  };
  cur={ idx:(meta&&meta.idx)||0, token:{}, lvl, mode, meta:meta||{}, src:levelObj,
        moves:0, won:false, earned:0, litKeys=new Set(), hist:[], hintUntil:0, hintSol:null,
        solution:null, autoUsed:false,
        flashT:0, t0:performance.now(), timeSec:0 };
  const sol=solve(lvl);
  cur.opt = sol ? sol.dist : null;
  if(sol){
    cur.solution={mask:sol.mask, rots:sol.rots, movs:sol.movs};
    const map=new Map();
    sol.rots.forEach((c,k)=>map.set(c.x+","+c.y,(sol.mask>>k)&1));
    cur.hintSol=map;
  }
  cur.vis=new Map();
  getRots(lvl).concat(lvl.movables).forEach(c=>{
    cur.vis.set(c,{a:angOf(c.o), ta:angOf(c.o), flash:0});
  });
  state.screen = (mode==='test') ? 'test' : 'play';
  drag=null; downPos=null; downCellObj=null; hoverObj=null; parts=[]; rings=[];
  resize();
  retrace(true);
  cur.litKeys=litTargets(lvl,cur.trace);
  updateHUD();
}
function loadCampaign(i){ startLevel(LEVELS[i],'campaign',{idx:i}); state.current=i; }
function enterDaily(){
  const tk=new Date().toDateString();
  if(state.dailyKey!==tk){ state.dailyKey=tk; state.dailyBest=0; }
  startLevel(DAILY[getDailyIdx()],'daily',{});
}
function px(gx){ return pad+gx*cell+cell/2; }
function py(gy){ return pad+gy*cell+cell/2; }

function retrace(silent){
  cur.trace=traceLevel(cur.lvl,null);
  const nowKeys=litTargets(cur.lvl,cur.trace);
  if(!silent){
    nowKeys.forEach(k=>{
      if(!cur.litKeys.has(k)){
        sPing();
        const xy=k.split(',').map(Number);
        burst(px(xy[0]),py(xy[1]),false);
      }
    });
  }
  cur.litKeys=nowKeys;
  if(nowKeys.size===cur.lvl.targets.length && !cur.won) winLevel();
}
function winLevel(){
  cur.won=true; cur.flashT=performance.now();
  cur.timeSec=(performance.now()-cur.t0)/1000;
  const opt=cur.opt!=null?cur.opt:cur.moves;
  cur.earned = cur.autoUsed ? 1 : (cur.moves<=opt ? 3 : cur.moves<=opt+2 ? 2 : 1);
  if(cur.mode==='campaign'){
    state.stars[cur.idx]=Math.max(state.stars[cur.idx],cur.earned);
    state.totalMoves+=cur.moves;
    state.maxUnlocked=Math.min(LEVELS.length-1, Math.max(state.maxUnlocked, cur.idx+1));
    const bt=state.bestTimes[cur.idx];
    if(bt==null||cur.timeSec<bt) state.bestTimes[cur.idx]=cur.timeSec;
  } else if(cur.mode==='daily'){
    state.dailyBest=Math.max(state.dailyBest,cur.earned);
  }
  sWin(); vib([30,40,60]);
  cur.lvl.targets.forEach(t=>{ burst(px(t.x),py(t.y),true); rings.push({x:px(t.x),y:py(t.y),r:cell*0.3,life:1}); });
  const tok=cur.token;
  setTimeout(()=>{ if(cur && cur.token===tok && cur.won) showWinOverlay(); },950);
}

function encodeLevel(L){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(L)))); }catch(e){ return null; }

function decodeLevel(code){
  try{
    const L=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!L||typeof L.w!=='number'||typeof L.h!=='number'||!L.emitter||!Array.isArray(L.targets)||!L.targets.length) return null;
    return L;
  }catch(e){ return null; }
}

const SIZES=[[6,5],[7,5],[8,6],[9,6],[9,7],[10,7]];
const TOOLS=[
 {id:'emitter', label:'🔦 Strahler'},
 {id:'mirror',  label:'🪞 Spiegel'},
 {id:'movable', label:'🪞⇄ Beweglich'},
 {id:'splitter',label:'🔮 Teiler'},
 {id:'prism',   label:'💠 Prisma'},
 {id:'filter',  label:'🎨 Filter'},
 {id:'target',  label:'💎 Ziel'},
 {id:'gate',    label:'⏩ Ventil'},
 {id:'block',   label:'⬛ Block'},
 {id:'portal',  label:'🌀 Portal'},
 {id:'erase',   label:'✖ Radieren'},
];
const ed={ w:8,h:6,sizeIdx:2, cells:new Map(), emitter:{x:0,y:2,d:1}, tool:'mirror', valid:null };
ed.cells.set('7,2',{t:'target',c:0});

function buildPalette(){
  paletteEl.innerHTML=TOOLS.map(t=>`<button class="chip ${t.id===ed.tool?'active':''}" data-t="${t.id}">${t.label}</button>`).join('');
  paletteEl.querySelectorAll('[data-t]').forEach(el=>el.addEventListener('click',()=>{
    ed.tool=el.dataset.t; buildPalette(); beep(520,0.05,'triangle',0.06);
  }));
}
function edSetMsg(s){ edMsgEl.textContent=s; }
function edUpdate(){
  const v=validateEd();
  ed.valid=v;
  edTrace = v.ok ? traceLevel(v.level,null) : null;
}
function validateEd(){
  if(!ed.emitter) return {ok:false,msg:'Setze einen Strahler 🔦.'};
  const arr={mirror:[],splitter:[],prism:[],movable:[],filter:[],target:[],block:[],portal:[],gate:[]};
  ed.cells.forEach((c,k)=>{
    const xy=k.split(',').map(Number);
    arr[c.t].push({x:xy[0],y:xy[1],o:c.o,c:c.c,d:c.d});
  });
  if(!arr.target.length) return {ok:false,msg:'Setze mindestens ein Ziel 💎.'};
  if(arr.portal.length===1) return {ok:false,msg:'Ein Portal braucht einen Zwilling – setze zwei 🌀.'};
  if(arr.portal.length>2) return {ok:false,msg:'Nur ein Portal-Paar erlaubt.'};
  const level={
    w:ed.w, h:ed.h, emitter:{...ed.emitter},
    mirrors:arr.mirror.map(p=>({x:p.x,y:p.y,o:p.o||0})),
    splitters:arr.splitter.map(p=>({x:p.x,y:p.y,o:p.o||0})),
    prism:arr.prism.map(p=>({x:p.x,y:p.y,o:p.o||0})),
    movables:arr.movable.map(p=>({x:p.x,y:p.y,o:p.o||0})),
    filters:arr.filter.map(p=>({x:p.x,y:p.y,c:p.c||1})),
    gates:arr.gate.map(p=>({x:p.x,y:p.y,d:p.d!=null?p.d:1})),
    blocks:arr.block.map(p=>({x:p.x,y:p.y})),
    targets:arr.target.map(p=>({x:p.x,y:p.y,c:p.c||0})),
    portals:arr.portal.length===2?[{a:{x:arr.portal[0].x,y:arr.portal[0].y},b:{x:arr.portal[1].x,y:arr.portal[1].y}}]:[],
    name:'Eigenes Rätsel', hint:''
  };
  return {ok:true,level,msg:''};
}
function levelToEd(L){
  ed.w=Math.min(12,Math.max(4,L.w|0)); ed.h=Math.min(10,Math.max(4,L.h|0));
  ed.cells.clear();
  (L.mirrors||[]).forEach(m=>ed.cells.set(m.x+","+m.y,{t:'mirror',o:m.o||0}));
  (L.splitters||[]).forEach(s=>ed.cells.set(s.x+","+s.y,{t:'splitter',o:s.o||0}));
  (L.prism||[]).forEach(p=>ed.cells.set(p.x+","+p.y,{t:'prism',o:p.o||0}));
  (L.movables||[]).forEach(m=>ed.cells.set(m.x+","+m.y,{t:'movable',o:m.o||0}));
  (L.filters||[]).forEach(f=>ed.cells.set(f.x+","+f.y,{t:'filter',c:f.c||1}));
  (L.gates||[]).forEach(g=>ed.cells.set(g.x+","+g.y,{t:'gate',d:g.d!=null?g.d:1}));
  (L.blocks||[]).forEach(b=>ed.cells.set(b.x+","+b.y,{t:'block'}));
  (L.targets||[]).forEach(t=>ed.cells.set(t.x+","+t.y,{t:'target',c:t.c||0}));
  (L.portals||[]).forEach(p=>{
    ed.cells.set(p.a.x+","+p.a.y,{t:'portal'});
    ed.cells.set(p.b.x+","+p.b.y,{t:'portal'});
  });
  ed.emitter={...L.emitter};
  const si=SIZES.findIndex(s=>s[0]===ed.w&&s[1]===ed.h);
  ed.sizeIdx=si>=0?si:2;
  document.getElementById('edSize').textContent=`📐 ${ed.w}×${ed.h}`;
}
function editorClick(gx,gy){
  const key=gx+","+gy;
  const existing=ed.cells.get(key);
  const isEm=ed.emitter && ed.emitter.x===gx && ed.emitter.y===gy;
  const t=ed.tool;
  if(t==='erase'){
    if(isEm) ed.emitter=null; else ed.cells.delete(key);
  } else if(t==='emitter'){
    if(isEm){ ed.emitter.d=(ed.emitter.d+1)%4; }
    else if(!existing){ ed.emitter={x:gx,y:gy,d:1}; }
  } else if(t==='portal'){
    if(isEm){ edSetMsg('Auf dem Strahler ist kein Platz.'); edUpdate(); return; }
    const pkeys=[...ed.cells.entries()].filter(([k,c])=>c.t==='portal').map(([k])=>k);
    if(existing && existing.t==='portal'){ ed.cells.delete(key); }
    else {
      if(pkeys.length>=2) pkeys.forEach(k=>ed.cells.delete(k));
      ed.cells.set(key,{t:'portal'});
    }
  } else {
    if(isEm){ edSetMsg('Auf dem Strahler ist kein Platz – erst radieren.'); edUpdate(); return; }
    if(existing && existing.t===t){
      if(t==='mirror'||t==='splitter'||t==='prism'||t==='movable') existing.o^=1;
      else if(t==='filter') existing.c=(existing.c%3)+1;
      else if(t==='target') existing.c=(existing.c+1)%7;
      else if(t==='gate') existing.d=(existing.d+1)%4;
    } else {
      const fresh=(t==='mirror'||t==='splitter'||t==='prism'||t==='movable')?{t,o:0} :
                  t==='filter'?{t,c:1} : t==='target'?{t,c:0} : t==='gate'?{t,d:1} : {t};
      ed.cells.set(key,fresh);
    }
  }
  beep(480,0.05,'triangle',0.06);
  edSetMsg('');
  edUpdate();
}

  state.screen='editor';
  hideOverlay();
  edbar.classList.remove('hidden');

  updateEditorHUD();

// ================= Eingabe (3-fach abgesichert) =================
function eventToCell(e){
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const gx=Math.floor((x-pad)/cell), gy=Math.floor((y-pad)/cell);
  if(gx<0||gy<0||gx>=viewW||gy>=viewH) return null;
  return {gx,gy};
}
function findRot(gx,gy){
  if(!cur) return null;
  return cur.lvl.mirrors.find(c=>c.x===gx&&c.y===gy) ||
         cur.lvl.splitters.find(c=>c.x===gx&&c.y===gy) ||
         cur.lvl.prism.find(c=>c.x===gx&&c.y===gy) ||
         cur.lvl.movables.find(c=>c.x===gx&&c.y===gy) || null;
}
function isMov(c){ return cur.lvl.movables.includes(c); }
function occSet(){
  const s=new Set();
  const L=cur.lvl;
  L.blocks.forEach(b=>s.add(b.x+","+b.y));
  L.targets.forEach(t=>s.add(t.x+","+t.y));
  L.filters.forEach(f=>s.add(f.x+","+f.y));
  L.gates.forEach(g=>s.add(g.x+","+g.y));
  L.portals.forEach(p=>{s.add(p.a.x+","+p.a.y);s.add(p.b.x+","+p.b.y);});
  getRots(L).forEach(r=>s.add(r.x+","+r.y));
  s.add(L.emitter.x+","+L.emitter.y);
  return s;
}
function rotateNow(c){
  lastRotKey=c.x+","+c.y; lastRotT=performance.now();
  cur.hist.push({t:'rot',x:c.x,y:c.y,o:c.o});
  c.o^=1;
  const v=cur.vis.get(c);
  if(v){ v.ta=angOf(c.o); v.flash=performance.now(); }
  cur.moves++;
  sTick(); vib(8);
  retrace(false);
  updateHUD();
}
// Pfad 1: pointerdown merkt sich Zelle, pointerup rotiert (Tap)
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(state.screen==='editor'){
    const pos=eventToCell(e); if(!pos) return;
    editorClick(pos.gx,pos.gy); return;
  }
  if(state.screen!=='play' && state.screen!=='test') return;
  if(!cur || cur.won) return;
  const pos=eventToCell(e);
  downPos={x:e.clientX,y:e.clientY};
  downCellObj = pos ? findRot(pos.gx,pos.gy) : null;
  if(downCellObj && isMov(downCellObj)){
    drag={m:downCellObj, sx:e.clientX, sy:e.clientY, px:e.clientX, py:e.clientY, active:false};
  }
});
window.addEventListener('pointermove',e=>{
  if(drag){
    drag.px=e.clientX; drag.py=e.clientY;
    if(!drag.active && Math.hypot(drag.px-drag.sx,drag.py-drag.sy)>12) drag.active=true;
    return;
  }
  if(state.screen==='editor'){
    const pos=eventToCell(e);
    hoverKey=pos?pos.gx+","+pos.gy:null;
    cv.style.cursor=pos?'pointer':'default';
    return;
  }
  if(!cur || (state.screen!=='play'&&state.screen!=='test')){ hoverObj=null; return; }
  const pos=eventToCell(e);
  hoverObj=(pos && findRot(pos.gx,pos.gy)) || null;
  cv.style.cursor=hoverObj?(isMov(hoverObj)?'grab':'pointer'):'default';
});
window.addEventListener('pointerup',e=>{
  if(drag){
    const d=drag; drag=null; downPos=null; downCellObj=null;
    lastDragT=performance.now();
    if(!cur || cur.won) return;
    if(!d.active){ rotateNow(d.m); return; }
    const r=cv.getBoundingClientRect();
    const gx=Math.floor((d.px-r.left-pad)/cell), gy=Math.floor((d.py-r.top-pad)/cell);
    if(gx<0||gy<0||gx>=viewW||gy>=viewH) return;
    if(gx===d.m.x&&gy===d.m.y) return;
    const occ=occSet();
    if(occ.has(gx+","+gy)) return;
    if(cur.lvl.movables.some(m=>m!==d.m&&m.x===gx&&m.y===gy)) return;
    cur.hist.push({t:'mov',fx:d.m.x,fy:d.m.y,tx:gx,ty:gy});
    d.m.x=gx; d.m.y=gy;
    const v=cur.vis.get(d.m); if(v) v.flash=performance.now();
    cur.moves++;
    sMove(); vib(15);
    retrace(false);
    updateHUD();
    return;
  }
  const c=downCellObj; downCellObj=null;
  const dp=downPos; downPos=null;
  if(!c) return;
  if(!cur || cur.won) return;
  if(state.screen!=='play' && state.screen!=='test') return;
  const moved = dp ? Math.hypot(e.clientX-dp.x, e.clientY-dp.y) : 99;
  if(moved<14) rotateNow(c);
});

const PCOLS=['#ffd76a','#7fe8ff','#ffffff','#ff9df0','#9dff9d'];
function burst(x,y,big){
  const n=big?44:10;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(big?2.1:1.1)*(0.4+Math.random())*cell*0.045;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(big?cell*0.05:0),
      life:1, decay:0.9+Math.random()*0.9,
      col:PCOLS[(Math.random()*PCOLS.length)|0]});
  }
  if(parts.length>460) parts.splice(0,parts.length-460);
}

// ================= Zeichnen =================
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function resize(){
  let w,h;
  if(state.screen==='editor'){ w=ed.w; h=ed.h; }
  else if(cur){ w=cur.lvl.w; h=cur.lvl.h; }
  else return;
  viewW=w; viewH=h;
  const stageW=document.getElementById('stage').clientWidth;
  const availH=Math.max(240, Math.min(window.innerHeight*0.72, 640));
  cell=Math.max(32, Math.floor(Math.min((stageW-16)/w,(availH-16)/h)));
  pad=Math.max(10, Math.round(cell*0.3));
  const cw=cell*w+pad*2, ch=cell*h+pad*2;
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
}
window.addEventListener('resize',resize);

function poly(P){ ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for(let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y); }
function drawBoard(w,h,t){
  const cw=cell*w+pad*2, ch=cell*h+pad*2;
  const bg=ctx.createLinearGradient(0,0,0,ch);
  bg.addColorStop(0,'#101c34'); bg.addColorStop(1,'#0a1120');
  ctx.fillStyle=bg; rr(1,1,cw-2,ch-2,15); ctx.fill();
  ctx.strokeStyle='rgba(140,180,255,0.16)'; ctx.lineWidth=1; ctx.stroke();
  const nb=ctx.createRadialGradient(cw*0.25+Math.sin(t*0.0002)*20,ch*0.3,0,cw*0.25,ch*0.3,cw*0.7);
  nb.addColorStop(0,'rgba(90,140,255,0.05)'); nb.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=nb; ctx.fillRect(0,0,cw,ch);
  for(let gy=0;gy<h;gy++) for(let gx=0;gx<w;gx++){
    if((gx+gy)%2===0){ ctx.fillStyle='rgba(255,255,255,0.016)'; ctx.fillRect(pad+gx*cell,pad+gy*cell,cell,cell); }
  }
  ctx.strokeStyle='rgba(148,180,255,0.07)'; ctx.lineWidth=1;
  for(let i=0;i<=w;i++){ ctx.beginPath(); ctx.moveTo(pad+i*cell,pad); ctx.lineTo(pad+i*cell,pad+h*cell); ctx.stroke(); }
  for(let j=0;j<=h;j++){ ctx.beginPath(); ctx.moveTo(pad,pad+j*cell); ctx.lineTo(pad+w*cell,pad+j*cell); ctx.stroke(); }
  const vg=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.35,cw/2,ch/2,Math.max(cw,ch)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle='rgba(127,232,255,0.35)'; ctx.lineWidth=2;
  const L=cell*0.45, m=6;
  [[m,m,1,1],[cw-m,m,-1,1],[m,ch-m,1,-1],[cw-m,ch-m,-1,-1]].forEach(c=>{
    ctx.beginPath();
    ctx.moveTo(c[0]+c[2]*L,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*L);
    ctx.stroke();
  });
}
function drawBeams(trace,emitter,t){
  if(!trace) return;
  ctx.lineCap='round'; ctx.lineJoin='round';
  trace.beams.forEach(bm=>{
    const pts=bm.pts; if(pts.length<2) return;
    const P=pts.map(p=>({x:px(p.x),y:py(p.y)}));
    const rgb=BEAMRGB[bm.col];
    ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.10)`; ctx.lineWidth=cell*0.32; poly(P); ctx.stroke();
    ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.30)`; ctx.lineWidth=cell*0.16; poly(P); ctx.stroke();
    ctx.save();
    ctx.shadowColor=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.9)`; ctx.shadowBlur=cell*0.22;
    ctx.strokeStyle=BEAMCORE[bm.col]; ctx.lineWidth=Math.max(2,cell*0.06); poly(P); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.85)';
    ctx.lineWidth=Math.max(1.5,cell*0.042);
    ctx.setLineDash([cell*0.10,cell*0.52]);
    ctx.lineDashOffset=-((t*0.001*cell*3)%(cell*0.62));
    poly(P); ctx.stroke();
    ctx.restore();
  });
  if(emitter){
    const ex=px(emitter.x)+DIRS[emitter.d].x*cell*0.4, ey=py(emitter.y)+DIRS[emitter.d].y*cell*0.4;
    const g=ctx.createRadialGradient(ex,ey,0,ex,ey,cell*0.4);
    g.addColorStop(0,'rgba(190,240,255,0.7)'); g.addColorStop(1,'rgba(190,240,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,cell*0.4,0,Math.PI*2); ctx.fill();
  }
}
function drawEmitter(e,t){
  const cx=px(e.x), cy=py(e.y), s=cell;
  const g=ctx.createLinearGradient(cx,cy-s/2,cx,cy+s/2);
  g.addColorStop(0,'#2b2115'); g.addColorStop(1,'#1b1409');
  ctx.fillStyle=g; rr(cx-s*0.4,cy-s*0.4,s*0.8,s*0.8,s*0.16); ctx.fill();
  ctx.strokeStyle='rgba(255,180,94,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  const d=DIRS[e.d], pxp=-d.y, pyp=d.x;
  ctx.fillStyle='#ffc46b';
  ctx.beginPath();
  ctx.moveTo(cx+d.x*s*0.3, cy+d.y*s*0.3);
  ctx.lineTo(cx-d.x*s*0.08+pxp*s*0.17, cy-d.y*s*0.08+pyp*s*0.17);
  ctx.lineTo(cx-d.x*s*0.08-pxp*s*0.17, cy-d.y*s*0.08-pyp*s*0.17);
  ctx.closePath(); ctx.fill();
  const pulse=0.5+0.5*Math.sin(t*0.005);
  ctx.save();
  ctx.shadowColor='#ffd9a0'; ctx.shadowBlur=10;
  ctx.fillStyle=`rgba(255,220,160,${0.5+0.5*pulse})`;
  ctx.beginPath(); ctx.arc(cx,cy,s*0.08,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle=`rgba(255,190,110,${0.35+0.3*pulse})`; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,s*0.30,0,Math.PI*2); ctx.stroke();
}
function drawBlock(b){
  const cx=px(b.x), cy=py(b.y), s=cell;

function drawGate(g,t){
  const cx=px(g.x), cy=py(g.y), s=cell, d=DIRS[g.d];
  ctx.fillStyle='rgba(120,255,190,0.10)';
  rr(cx-s*0.38,cy-s*0.38,s*0.76,s*0.76,s*0.14); ctx.fill();
  ctx.strokeStyle='rgba(120,255,190,0.7)'; ctx.lineWidth=2; ctx.stroke();
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(Math.atan2(d.y,d.x));
  ctx.strokeStyle='rgba(160,255,210,0.9)'; ctx.lineWidth=2; ctx.lineCap='round';
  for(let i=-1;i<=1;i++){
    const ox=i*s*0.16;

    ctx.moveTo(ox-s*0.08,-s*0.16); ctx.lineTo(ox+s*0.08,0); ctx.lineTo(ox-s*0.08,s*0.16);
    ctx.stroke();

  ctx.restore();

function drawPortalCell(x,y,t){
  const cx=px(x), cy=py(y), r=cell*0.30;

  g.addColorStop(0,'rgba(190,120,255,0.45)'); g.addColorStop(1,'rgba(190,120,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#150b26'; ctx.beginPath(); ctx.arc(cx,cy,r*0.72,0,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.strokeStyle='rgba(210,150,255,0.9)'; ctx.lineWidth=2.2;
  ctx.setLineDash([cell*0.14,cell*0.11]); ctx.lineDashOffset=-t*0.02;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([cell*0.07,cell*0.09]); ctx.lineDashOffset=t*0.03;

  ctx.restore();
}
function drawBar(cx,cy,ang,isSplit){
  ctx.fillStyle='rgba(255,255,255,0.035)';

  } else {

function drawPrism(cx,cy,ang){

  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(ang);
  const r=cell*0.30;
  const V=[[0,-r],[r*0.95,r*0.75],[-r*0.95,r*0.75]];

function drawGhost(cx,cy,ang){

function drawTarget(tg,t,trace){
  const key=tg.x+","+tg.y;
  const lit=trace ? litSet.has(key) : false;
  const wrong=trace && trace.wrongT.has(key);
  const tc=TCOL[tg.c||0];
  const cx=px(tg.x), cy=py(tg.y);
  const pulse=lit?1+0.07*Math.sin(t*0.006):1;
  const r=cell*0.26*pulse;
  if(lit){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*3.2);
    g.addColorStop(0,`rgba(${tc.gl},0.42)`); g.addColorStop(1,`rgba(${tc.gl},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*3.2,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.strokeStyle=`rgba(${tc.gl},0.5)`; ctx.lineWidth=1.5;
    for(let i=0;i<4;i++){
      const a=t*0.001+i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r*1.35, cy+Math.sin(a)*r*1.35);
      ctx.lineTo(cx+Math.cos(a)*r*1.85, cy+Math.sin(a)*r*1.85);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.save();
  if(lit){ ctx.shadowColor=`rgba(${tc.gl},0.9)`; ctx.shadowBlur=cell*0.3; }
  ctx.beginPath();
  ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath();
  if(lit){
    const g2=ctx.createLinearGradient(cx,cy-r,cx,cy+r);
    g2.addColorStop(0,tc.lit1); g2.addColorStop(1,tc.lit2);
    ctx.fillStyle=g2; ctx.fill();
    ctx.strokeStyle=tc.stL;
  } else {
    ctx.fillStyle=tc.un; ctx.fill();
    ctx.strokeStyle=tc.stU;
  }
  ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(cx,cy-r); ctx.lineTo(cx,cy+r);
  ctx.moveTo(cx-r,cy); ctx.lineTo(cx+r,cy);
  ctx.strokeStyle=lit?'rgba(255,255,255,0.5)':'rgba(255,255,255,0.14)';
  ctx.lineWidth=1; ctx.stroke();
  if(!lit && MIXREQ[tg.c]){
    const req=MIXREQ[tg.c];
    ctx.fillStyle=DOTCOL[req[0]]; ctx.beginPath(); ctx.arc(cx-r*0.45,cy,r*0.14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=DOTCOL[req[1]]; ctx.beginPath(); ctx.arc(cx+r*0.45,cy,r*0.14,0,Math.PI*2); ctx.fill();
  }
  if(lit){
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.25,cy-r*0.3,r*0.16,r*0.09,-0.6,0,Math.PI*2); ctx.fill();
  }
  if(wrong && !lit){
    ctx.strokeStyle='rgba(255,120,120,0.85)'; ctx.lineWidth=2;
    const k=cell*0.12;
    ctx.beginPath();
    ctx.moveTo(cx-k,cy-k); ctx.lineTo(cx+k,cy+k);
    ctx.moveTo(cx+k,cy-k); ctx.lineTo(cx-k,cy+k);
    ctx.stroke();
  }
}
function drawGameRotatable(c,kind,t,dt){
  const v=cur.vis.get(c);
  if(v) v.a+=(v.ta-v.a)*Math.min(1,dt/70);
  const cx=px(c.x), cy=py(c.y);
  const a=v?v.a:angOf(c.o);
  if(kind==='movable') drawMovableMarks(cx,cy);
  if(kind==='prism') drawPrism(cx,cy,a); else drawBar(cx,cy,a,kind==='splitter');
  if(cur.hintUntil>t && cur.hintSol){
    const so=cur.hintSol.get(c.x+","+c.y);
    if(so!==undefined && so!==c.o) drawGhost(cx,cy,angOf(so));
  }
  if(v){
    const age=performance.now()-v.flash;
    if(age<380){
      const k=age/380;
      ctx.strokeStyle=`rgba(140,230,255,${0.5*(1-k)})`;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,cell*(0.2+0.45*k),0,Math.PI*2); ctx.stroke();
    }
  }
  if(hoverObj===c && !cur.won){
    ctx.strokeStyle='rgba(140,230,255,0.55)'; ctx.lineWidth=2;
    rr(cx-cell*0.46,cy-cell*0.46,cell*0.92,cell*0.92,cell*0.14); ctx.stroke();
  }
}
function drawPortalLinks(portals,t){
  (portals||[]).forEach(p=>{
    ctx.save();
    ctx.strokeStyle='rgba(200,150,255,0.20)'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,9]); ctx.lineDashOffset=-t*0.015;
    ctx.beginPath(); ctx.moveTo(px(p.a.x),py(p.a.y)); ctx.lineTo(px(p.b.x),py(p.b.y)); ctx.stroke();
    ctx.restore();
  });
}
function drawGameScene(t,dt){
  drawBoard(cur.lvl.w,cur.lvl.h,t);
  drawPortalLinks(cur.lvl.portals,t);
  cur.lvl.blocks.forEach(drawBlock);
  cur.lvl.filters.forEach(drawFilter);
  cur.lvl.gates.forEach(g=>drawGate(g,t));
  drawEmitter(cur.lvl.emitter,t);
  (cur.lvl.portals||[]).forEach(p=>{ drawPortalCell(p.a.x,p.a.y,t); drawPortalCell(p.b.x,p.b.y,t); });
  litSet=cur.litKeys;
  cur.lvl.mirrors.forEach(m=>drawGameRotatable(m,'mirror',t,dt));
  cur.lvl.splitters.forEach(s=>drawGameRotatable(s,'splitter',t,dt));
  cur.lvl.prism.forEach(p=>drawGameRotatable(p,'prism',t,dt));
  cur.lvl.movables.forEach(m=>drawGameRotatable(m,'movable',t,dt));
  drawBeams(cur.trace,cur.lvl.emitter,t);
  cur.lvl.targets.forEach(tg=>drawTarget(tg,t,cur.trace));
  if(drag && drag.active){
    const r=cv.getBoundingClientRect();
    const gx=Math.floor((drag.px-r.left-pad)/cell), gy=Math.floor((drag.py-r.top-pad)/cell);
    if(gx>=0&&gy>=0&&gx<viewW&&gy<viewH){
      const occ=occSet();
      const free=!occ.has(gx+","+gy)&&!cur.lvl.movables.some(m=>m!==drag.m&&m.x===gx&&m.y===gy);
      ctx.strokeStyle=free?'rgba(140,255,190,0.7)':'rgba(255,110,120,0.7)';
      ctx.lineWidth=2.5;
      rr(px(gx)-cell*0.44,py(gy)-cell*0.44,cell*0.88,cell*0.88,cell*0.14); ctx.stroke();
    }
    ctx.save();
    ctx.globalAlpha=0.65;
    drawBar(drag.px-r.left,drag.py-r.top,cur.vis.get(drag.m).a,false);
    ctx.restore();
  }
  rings=rings.filter(rg=>rg.life>0);
  rings.forEach(rg=>{
    rg.r+=cell*0.12; rg.life-=0.03;
    ctx.strokeStyle=`rgba(255,230,160,${Math.max(0,rg.life)*0.6})`;
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2); ctx.stroke();
  });
  const dtN=dt/16.7;
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=cell*0.0035*dtN;
    p.x+=p.vx*dtN; p.y+=p.vy*dtN; p.life-=0.02*p.decay*dtN;
    if(p.life<=0) return;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.8,cell*0.045*p.life+0.8),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  if(cur.flashT){
    const age=performance.now()-cur.flashT;
    if(age<450){
      ctx.fillStyle=`rgba(255,255,255,${0.22*(1-age/450)})`;
      ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
    }
  }
}
function drawEditorScene(t){
  drawBoard(ed.w,ed.h,t);
  litSet = (edTrace && ed.valid && ed.valid.ok) ? litTargets(ed.valid.level,edTrace) : new Set();
  const pk=[...ed.cells.entries()].filter(([k,c])=>c.t==='portal');
  if(pk.length===2){
    const a=pk[0][0].split(',').map(Number), b=pk[1][0].split(',').map(Number);
    ctx.save();
    ctx.strokeStyle='rgba(200,150,255,0.20)'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,9]); ctx.lineDashOffset=-t*0.015;
    ctx.beginPath(); ctx.moveTo(px(a[0]),py(a[1])); ctx.lineTo(px(b[0]),py(b[1])); ctx.stroke();
    ctx.restore();
  }
  ed.cells.forEach((c,k)=>{
    const xy=k.split(',').map(Number), cx=px(xy[0]), cy=py(xy[1]);
    if(c.t==='mirror') drawBar(cx,cy,angOf(c.o||0),false);
    else if(c.t==='splitter') drawBar(cx,cy,angOf(c.o||0),true);
    else if(c.t==='movable'){ drawMovableMarks(cx,cy); drawBar(cx,cy,angOf(c.o||0),false); }
    else if(c.t==='prism') drawPrism(cx,cy,angOf(c.o||0));
    else if(c.t==='block') drawBlock({x:xy[0],y:xy[1]});
    else if(c.t==='filter') drawFilter({x:xy[0],y:xy[1],c:c.c});
    else if(c.t==='gate') drawGate({x:xy[0],y:xy[1],d:c.d!=null?c.d:1},t);
    else if(c.t==='target') drawTarget({x:xy[0],y:xy[1],c:c.c||0},t,edTrace);
    else if(c.t==='portal') drawPortalCell(xy[0],xy[1],t);
  });
  if(ed.emitter) drawEmitter(ed.emitter,t);
  drawBeams(edTrace,ed.emitter,t);
  if(hoverKey){
    const xy=hoverKey.split(',').map(Number);
    ctx.strokeStyle='rgba(255,230,150,0.6)'; ctx.lineWidth=2;
    rr(px(xy[0])-cell*0.46,py(xy[1])-cell*0.46,cell*0.92,cell*0.92,cell*0.14); ctx.stroke();
  }
}
let lastT=performance.now();
function render(t){
  requestAnimationFrame(render);
  const dt=Math.min(50,t-lastT); lastT=t;
  try{
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);
    if(state.screen==='editor'){ drawEditorScene(t); return; }
    if(!cur) return;
    drawGameScene(t,dt);
  }catch(err){ /* Render-Failsafe */ }
}

// ================= Start =================
loadCampaign(0);
showHub();
requestAnimationFrame(render);
})();
</script>
