<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Lichtpfad ✦ Das Licht-Rätsel</title>
<style>
  :root{ --cyan:#5fe0ff; --gold:#ffd76a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ font-size:17px; }
  body{
    margin:0; min-height:100dvh; color:#dbe7ff; user-select:none; font-size:1rem;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 15% -10%, #14203c 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 20%, #1a1230 0%, transparent 55%),
      linear-gradient(180deg,#070b14,#05070d);
    display:flex; justify-content:center;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.7;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 28% 68%, rgba(180,220,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 44% 12%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 63% 41%, rgba(200,180,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 78% 76%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 90% 18%, rgba(160,230,255,.6), transparent),
      radial-gradient(1px 1px at 8% 88%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 55% 90%, rgba(190,200,255,.5), transparent);
    animation:twk 7s ease-in-out infinite alternate;
  }
  @keyframes twk{ from{opacity:.45} to{opacity:.9} }
  body::after{
    content:''; position:fixed; top:0; left:-10%; width:2px; height:2px; z-index:0;
    background:rgba(255,255,255,.9); border-radius:50%; pointer-events:none;
    box-shadow:0 0 8px 2px rgba(160,220,255,.6);
    animation:shoot 9s linear infinite;
  }
  @keyframes shoot{
    0%{ transform:translate(0,0); opacity:0; }
    3%{ opacity:1; }
    12%{ transform:translate(60vw,38vh); opacity:0; }
    100%{ transform:translate(60vw,38vh); opacity:0; }
  }
  #app{ width:100%; max-width:760px; padding:10px 12px 26px; position:relative; z-index:1; }
  header{ text-align:center; padding:6px 0 2px; }
  header h1{
    margin:0; font-size:clamp(1.6rem,5.5vw,2.2rem); font-weight:800; letter-spacing:.34em; padding-left:.34em;
    background:linear-gradient(90deg,#7fe8ff,#c9b2ff 55%,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(127,232,255,.35));
  }
  header p{ margin:3px 0 0; color:#7f93b8; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    margin:10px 0 8px; padding:10px 12px; border-radius:14px;
    background:rgba(255,255,255,.045); border:1px solid rgba(140,180,255,.14);
  }
  #lvlinfo{ display:flex; flex-direction:column; min-width:120px; }
  #lvlnum{ font-size:.78rem; letter-spacing:.14em; color:#7f93b8; text-transform:uppercase; }
  #lvlname{ font-size:1.15rem; font-weight:700; color:#eaf3ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tb-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #moves{ font-size:.95rem; color:#a9bce0; margin-right:2px; white-space:nowrap; }
  .iconbtn{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    color:#cfe6ff; width:2.5rem; height:2.5rem; border-radius:12px; cursor:pointer; font-size:1.15rem; line-height:1; padding:0;
  }
  .iconbtn:hover{ background:rgba(255,255,255,.12); }
  #dots{ display:flex; gap:4px; margin:0 4px; flex-wrap:wrap; max-width:190px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#2a3450; border:1px solid #3b4a72; }
  .dot.done{ background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 8px rgba(95,224,255,.7); }
  .dot.cur{ border-color:#c9b2ff; box-shadow:0 0 0 3px rgba(201,178,255,.22); }
  #stage{ position:relative; display:flex; justify-content:center; }
  canvas{ touch-action:none; border-radius:16px; display:block; }
  #hint{ text-align:center; color:#9db1d6; font-size:1rem; min-height:1.5rem; margin:10px 4px 0; }
  #hint .opt{ color:#66799f; }
  #overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:12px;
    background:rgba(5,8,16,.78); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    z-index:50;
  }
  .hidden{ display:none !important; }
  #toast{
    position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-90px);
    z-index:70; background:linear-gradient(180deg,#1a2a4a,#12203a);
    border:1px solid rgba(255,215,106,.5); color:#ffe9a8; padding:10px 20px; border-radius:999px;
    font-size:.95rem; font-weight:700; transition:transform .45s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }
  .panel{
    background:linear-gradient(180deg,#111c33,#0b1222);
    border:1px solid rgba(130,180,255,.22); border-radius:18px;
    padding:1.5rem 1.6rem; text-align:center; max-width:96%; width:480px; max-height:94dvh; overflow:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .panel .big{ font-size:1.55rem; font-weight:800; letter-spacing:.1em; color:#eaf3ff; }
  .panel .big.brand{
    font-size:clamp(1.6rem,6vw,2.1rem); letter-spacing:.26em; padding-left:.26em;
    background:linear-gradient(90deg,#7fe8ff,#c9b2ff 55%,#ffd76a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .panel .sub{ color:#8fa3c8; font-size:.95rem; margin:8px 0 0; }
  .menu{ display:flex; flex-direction:column; gap:9px; margin:16px 0 4px; }
  .mbtn{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    background:rgba(255,255,255,.055); border:1px solid rgba(140,180,255,.18); color:#eaf3ff;
    border-radius:13px; padding:.85rem 1.05rem; font-size:1.05rem; font-weight:700; cursor:pointer;
    font-family:inherit; text-align:left;
  }
  .mbtn:hover{ background:rgba(255,255,255,.11); border-color:rgba(140,200,255,.42); }
  .mbtn span{ font-size:.8rem; color:#8fa3c8; font-weight:500; text-align:right; flex-shrink:0; }
  .csec{ margin-top:12px; font-size:.8rem; color:#7f93b8; letter-spacing:.1em; text-transform:uppercase; }
  .crow{ display:flex; gap:8px; margin-top:7px; }
  .crow .mbtn{ flex:1; padding:9px 14px; font-size:.95rem; }
  .cdel{ background:rgba(255,90,110,.12); border:1px solid rgba(255,90,110,.35); color:#ff9daa; width:44px; border-radius:13px; cursor:pointer; font-size:1rem; }
  .rules{ list-style:none; padding:0; margin:14px 0 4px; text-align:left; display:inline-block; }
  .rules li{ margin:8px 0; font-size:.92rem; color:#9fb2d4; max-width:420px; }
  .btn{
    background:linear-gradient(180deg,#3fdcff,#0ea5d8); color:#04202c; font-weight:800;
    border:none; padding:.8rem 1.6rem; border-radius:999px; cursor:pointer; font-size:1.05rem;
    box-shadow:0 6px 20px rgba(40,200,255,.35); letter-spacing:.03em;
  }
  .btn:hover{ filter:brightness(1.12); }
  .btn.ghost{ background:rgba(255,255,255,.08); color:#cfe6ff; box-shadow:none; border:1px solid rgba(255,255,255,.2); font-weight:600; }
  .btnrow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .stars{ margin:14px 0 4px; }
  .stars span{ display:inline-block; font-size:2.7rem; color:#39415a; margin:0 5px; }
  .stars span.on{ color:var(--gold); text-shadow:0 0 18px rgba(255,205,90,.75); animation:pop .55s backwards; }
  @keyframes pop{ 0%{transform:scale(0) rotate(-40deg);opacity:0} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .stat{ color:#a9bce0; font-size:1rem; margin:6px 0 18px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; margin-top:16px; }
  .card{
    background:rgba(255,255,255,.05); border:1px solid rgba(140,180,255,.18); border-radius:12px;
    padding:11px 6px 10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; align-items:center;
    color:#dbe7ff; font-family:inherit;
  }
  .card:hover{ background:rgba(255,255,255,.11); }
  .card.cur{ border-color:#7fe8ff; box-shadow:0 0 0 2px rgba(127,232,255,.25); }
  .card.locked{ opacity:.42; cursor:default; }
  .cnum{ font-weight:800; font-size:1.2rem; color:#7fe8ff; }
  .cname{ font-size:.8rem; color:#a9bce0; white-space:nowrap; overflow:hidden; max-width:100%; text-overflow:ellipsis; }
  .cstars{ font-size:.8rem; color:#ffd76a; letter-spacing:1px; }
  .achrow{ display:flex; gap:10px; align-items:center; text-align:left; padding:8px 10px; border-radius:12px; margin:6px 0; background:rgba(255,255,255,.04); opacity:.45; }
  .achrow.on{ opacity:1; background:rgba(255,215,106,.08); border:1px solid rgba(255,215,106,.25); }
  .aic{ font-size:1.3rem; }
  .atx{ flex:1; font-size:.9rem; color:#c4d4f2; }
  .atx small{ color:#8fa3c8; }
  .ast{ color:#ffd76a; }
  .ta{
    width:100%; min-height:6.5rem; margin:12px 0; background:#0a1122; color:#bfe9ff;
    border:1px solid rgba(140,180,255,.25); border-radius:12px; padding:10px; font-size:.85rem;
    font-family:ui-monospace,Menlo,Consolas,monospace; resize:vertical;
  }
  #edbar{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .edrow{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .chip{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); color:#cfe6ff;
    border-radius:999px; padding:9px 14px; font-size:.92rem; cursor:pointer; font-family:inherit;
  }
  .chip:hover{ background:rgba(255,255,255,.12); }
  .chip.active{ border-color:#7fe8ff; background:rgba(127,232,255,.16); color:#eaffff; box-shadow:0 0 10px rgba(127,232,255,.3); }
  #edMsg{ text-align:center; font-size:.92rem; color:#8fa3c8; min-height:1.2rem; }
  @media (max-width:640px){
    html{ font-size:18px; }
    header h1{ letter-spacing:.2em; padding-left:.2em; }
    #app{ padding:6px 8px 20px; }
    .iconbtn{ width:2.7rem; height:2.7rem; font-size:1.25rem; }
    #lvlname{ font-size:1.25rem; }
    #lvlnum{ font-size:.82rem; }
    #moves{ font-size:1rem; }
    #hint{ font-size:1.02rem; }
    .panel{ padding:1.2rem 1rem; }
    .mbtn{ font-size:1.1rem; }
    .mbtn span{ font-size:.82rem; }
    .rules li{ font-size:.98rem; }
    .chip{ font-size:.98rem; padding:10px 15px; }
    .stat{ font-size:1.05rem; }
    .btn{ font-size:1.1rem; }
    #edMsg{ font-size:.98rem; }
    .cstars{ font-size:.85rem; }
    .cname{ font-size:.85rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✦ LICHTPFAD ✦</h1>
    <p>Das Licht-Rätsel · 22 Level · Zen · Themes · Editor</p>
  </header>
  <div id="topbar">
    <div id="lvlinfo">
      <span id="lvlnum">Level 1/22</span>
      <span id="lvlname">–</span>
    </div>
    <div id="tb-right">
      <span id="moves">Züge: 0</span>
      <span id="dots"></span>
      <button class="iconbtn" id="btnUndo"  title="Zug rückgängig">↩</button>
      <button class="iconbtn" id="btnReset" title="Zurücksetzen">⟳</button>
      <button class="iconbtn" id="btnHint"  title="Lösung kurz anzeigen">💡</button>
      <button class="iconbtn" id="btnAuto"  title="Automatisch lösen">🤖</button>
      <button class="iconbtn" id="btnTheme" title="Board-Theme wechseln">🎨</button>
      <button class="iconbtn" id="btnMenu"  title="Menü">⊞</button>
      <button class="iconbtn" id="btnSound" title="Effekte an/aus">🔊</button>
      <button class="iconbtn" id="btnMusic" title="Musik an/aus">🎵</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
  </div>
  <p id="hint"></p>
  <div id="edbar" class="hidden">
    <div class="edrow" id="palette"></div>
    <div class="edrow">
      <button class="chip" id="edSize">📐 8×6</button>
      <button class="chip" id="edCheck">🧪 Lösbar?</button>
      <button class="chip" id="edTest">▶ Testen</button>
      <button class="chip" id="edSave">💾 Speichern</button>
      <button class="chip" id="edShare">📤 Code</button>
      <button class="chip" id="edClear">🗑 Leer</button>
      <button class="chip" id="edExit">← Fertig</button>
    </div>
    <div id="edMsg"></div>
  </div>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>

}

var musicOn=true, mNodes=null, mTimer=null, mStep=0, mNext=0, mLoop=0, noiseBuf=null, mIntensity=0;
var PROG_A=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
var PROG_B=[[57,60,64],[55,59,62],[53,57,60],[48,52,55]];
var PENTA=[69,72,74,76,79,81,84];
function mFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function getNoise(a){
  if(!noiseBuf){
    var len=Math.floor(a.sampleRate*0.2);
    noiseBuf=a.createBuffer(1,len,a.sampleRate);
    var d=noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function startMusic(){
  if(!musicOn||mNodes) return; var a=ac(); if(!a) return;
  try{
    var master=a.createGain(); master.gain.value=0.0001; master.connect(a.destination);
    master.gain.linearRampToValueAtTime(0.55,a.currentTime+2.5);
    var delay=a.createDelay(2); delay.delayTime.value=0.59;
    var fb=a.createGain(); fb.gain.value=0.32; delay.connect(fb); fb.connect(delay);
    var wet=a.createGain(); wet.gain.value=0.4; delay.connect(wet); wet.connect(master);
    mNodes={a:a,master:master,delay:delay};
    mNext=a.currentTime+0.1; mStep=0; mLoop=0;
    mTimer=setInterval(mSchedule,120);
  }catch(e){}
}
function mSchedule(){
  if(!mNodes) return;
  var a=mNodes.a;
  var spb=60/76/2;
  while(mNext<a.currentTime+0.35){
    mPlayStep(mStep,mNext,spb);
    mNext+=spb; mStep=(mStep+1)%64;
    if(mStep===0) mLoop++;
  }
}
function mPlayStep(step,t,spb){
  var master=mNodes.master, delay=mNodes.delay, a=mNodes.a;
  var PROG=(mLoop%2===0)?PROG_A:PROG_B;
  var bar=Math.floor(step/8)%4, inBar=step%8, ch=PROG[bar];
  if(inBar===0){
    ch.forEach(function(m){ mPad(mFreq(m),t,spb*8,master,a); });
    mBass(mFreq(ch[0]-12),t,spb*4,master,a);
    mKick(t,master,a);
  }
  if(inBar===4){
    mBass(mFreq(ch[0]-5),t,spb*4,master,a);
  }
  if(inBar%2===1) mHat(t,master,a,0.010+0.008*mIntensity);
  if(inBar===2||inBar===6){
    if(Math.random()<0.35+0.3*mIntensity){
      var pool=[ch[0]+12,ch[1]+12,ch[2]+12].concat(PENTA);
      mPluck(mFreq(pool[(Math.random()*pool.length)|0]),t,master,delay,a,0.065);
    }
  }
  if(inBar===3||inBar===7){
    mPluck(mFreq(ch[2]+12),t,master,delay,a,0.04);
  }
  if(mIntensity>0.6 && inBar%2===0){
    mPluck(mFreq(ch[2]+24),t,master,delay,a,0.02);
  }
}
function mPad(f,t,dur,master,a){
  var o=a.createOscillator(); o.type='sine'; o.frequency.value=f;
  var o2=a.createOscillator(); o2.type='triangle'; o2.frequency.value=f*1.006;
  var g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.032,t+dur*0.3);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g); o2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t+dur+0.1); o2.stop(t+dur+0.1);
}
function mBass(f,t,dur,master,a){
  var o=a.createOscillator(); o.type='triangle'; o.frequency.value=f;
  var g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.055,t+0.06);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1);
}
function mKick(t,master,a){
  try{
    var o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    var g=a.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.07,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.2);
  }catch(e){}
}
function mHat(t,master,a,vol){
  try{
    var src=a.createBufferSource(); src.buffer=getNoise(a);
    var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=6500;
    var g=a.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }catch(e){}
}
function mPluck(f,t,master,delay,a,vol){
  var o=a.createOscillator(); o.type='sine'; o.frequency.value=f;
  var g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.connect(g); g.connect(master); g.connect(delay);
  o.start(t); o.stop(t+0.6);
}
function stopMusic(){
  if(mTimer){ clearInterval(mTimer); mTimer=null; }
  if(mNodes){
    var n=mNodes;
    try{ n.master.gain.cancelScheduledValues(0); n.master.gain.setTargetAtTime(0,n.a.currentTime,0.25); }catch(e){}
    setTimeout(function(){ try{ n.master.disconnect(); }catch(e){} },800);
    mNodes=null;
  }
}
function ensureAudio(){ ac(); if(musicOn) startMusic(); }

function traceLevel(level, orient){
  var cells=new Map();
  function put(x,y,v){ cells.set(x+","+y,v); }
  (level.blocks||[]).forEach(function(b){ put(b.x,b.y,{t:'block'}); });
  (level.targets||[]).forEach(function(tg){ put(tg.x,tg.y,{t:'target',c:tg.c||0}); });
  (level.shards||[]).forEach(function(s){ put(s.x,s.y,{t:'shard'}); });
  (level.mirrors||[]).forEach(function(m){ put(m.x,m.y,{t:'mirror', o: orient? orient.get(m.x+","+m.y) : m.o}); });
  (level.splitters||[]).forEach(function(s){ put(s.x,s.y,{t:'splitter', o: orient? orient.get(s.x+","+s.y) : s.o}); });
  (level.prism||[]).forEach(function(p){ put(p.x,p.y,{t:'prism', o: orient? orient.get(p.x+","+p.y) : p.o}); });
  (level.movables||[]).forEach(function(m){ put(m.x,m.y,{t:'mirror', o: orient? (orient.has(m.x+","+m.y)?orient.get(m.x+","+m.y):m.o) : m.o}); });
  (level.filters||[]).forEach(function(f){ put(f.x,f.y,{t:'filter',c:f.c}); });
  (level.gates||[]).forEach(function(g){ put(g.x,g.y,{t:'gate',d:g.d}); });
  (level.portals||[]).forEach(function(p){
    put(p.a.x,p.a.y,{t:'portal',ox:p.b.x,oy:p.b.y});
    put(p.b.x,p.b.y,{t:'portal',ox:p.a.x,oy:p.a.y});
  });
  put(level.emitter.x,level.emitter.y,{t:'emitter'});

  var beams=[], hits=new Map(), wrongT=new Set(), shardHits=new Set(), portalUsed=new Set();
  var q=[{x:level.emitter.x,y:level.emitter.y,d:level.emitter.d,col:0}];
  var bg=0;
  while(q.length && bg++<80){
    var st=q.shift();
    var x=st.x, y=st.y, d=st.d, col=st.col;
    var pts=[{x:x,y:y}], seen=new Set();
    var guard=0;
    while(guard++<400){
      var dx=DIRS[d].x, dy=DIRS[d].y, nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=level.w||ny>=level.h){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
      var key=nx+","+ny, c=cells.get(key), skey=key+","+d+","+col;
      if(c){
        if(seen.has(skey)){ pts.push({x:nx,y:ny}); break; }
        seen.add(skey);
        if(c.t==='block'||c.t==='emitter'){ pts.push({x:x+dx*0.5,y:y+dy*0.5}); break; }
        if(c.t==='shard'){ shardHits.add(key); pts.push({x:nx,y:ny}); x=nx; y=ny; continue; }
        if(c.t==='gate'){
          if(d===c.d){ pts.push({x:nx,y:ny}); x=nx; y=ny; continue; }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break;
        }
        if(c.t==='target'){
          pts.push({x:nx,y:ny});
          var hs=hits.get(key); if(!hs){ hs=new Set(); hits.set(key,hs); }
          hs.add(col);
          if(c.c>=1&&c.c<=3&&col!==c.c) wrongT.add(key);
          break;
        }
        if(c.t==='filter'){
          if(col===0){ pts.push({x:nx,y:ny}); q.push({x:nx,y:ny,d:d,col:c.c}); break; }
          if(col===c.c){ pts.push({x:nx,y:ny}); x=nx; y=ny; continue; }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break;
        }
        if(c.t==='portal'){
          portalUsed.add(key); portalUsed.add(c.ox+","+c.oy);
          pts.push({x:nx,y:ny});
          pts.push({x:c.ox,y:c.oy});
          x=c.ox; y=c.oy; continue;
        }
        if(c.t==='prism'){
          if(col===0){
            pts.push({x:nx,y:ny});
            q.push({x:nx,y:ny,d:d,col:1});
            q.push({x:nx,y:ny,d:refl(d,c.o),col:2});
            q.push({x:nx,y:ny,d:refl(d,1-c.o),col:3});
            break;
          }
          pts.push({x:x+dx*0.5,y:y+dy*0.5}); break;
        }
        pts.push({x:nx,y:ny});
        if(c.t==='mirror'){ d=refl(d,c.o); x=nx; y=ny; continue; }
        if(c.t==='splitter'){ q.push({x:nx,y:ny,d:refl(d,c.o),col:col}); x=nx; y=ny; continue; }
      } else {
        if(seen.has(skey)) break;
        seen.add(skey);
        pts.push({x:nx,y:ny}); x=nx; y=ny;
      }
    }
    beams.push({pts:pts,col:col});
  }
  return {beams:beams,hits:hits,wrongT:wrongT,shards:shardHits,portals:portalUsed};
}
function litTargets(level,trace){
  return new Set(level.targets.filter(function(tg){
    var s=trace.hits.get(tg.x+","+tg.y);
    if(!s||!s.size) return false;
    if(tg.c===0) return true;
    if(MIXREQ[tg.c]) return MIXREQ[tg.c].every(function(cc){ return s.has(cc); });
    return s.has(tg.c);
  }).map(function(tg){ return tg.x+","+tg.y; }));
}
function evalWin(level,trace){ return litTargets(level,trace).size===level.targets.length; }

// ================= Löser =================
function solve(level){
  var rots=getRots(level);
  var movs=(level.movables||[]).map(function(m){ return {x:m.x,y:m.y,o:m.o}; });
  if(rots.length+movs.length>14) return null;
  var occ=new Set();
  (level.blocks||[]).forEach(function(b){ occ.add(b.x+","+b.y); });
  (level.targets||[]).forEach(function(t){ occ.add(t.x+","+t.y); });
  (level.filters||[]).forEach(function(f){ occ.add(f.x+","+f.y); });
  (level.gates||[]).forEach(function(g){ occ.add(g.x+","+g.y); });
  (level.portals||[]).forEach(function(p){ occ.add(p.a.x+","+p.a.y); occ.add(p.b.x+","+p.b.y); });
  rots.forEach(function(r){ occ.add(r.x+","+r.y); });
  occ.add(level.emitter.x+","+level.emitter.y);
  var nR=rots.length;
  function enc(mask,mv){ return mask+"|"+mv.map(function(m){ return m.x+","+m.y+","+m.o; }).join(";"); }
  var startKey=enc(0,movs);
  var dist=new Map([[startKey,0]]);
  var queue=[{mask:0,movs:movs,key:startKey}];
  var head=0;
  while(head<queue.length){
    if(head>60000) return null;
    var st=queue[head++], dd=dist.get(st.key);
    var orient=new Map();
    rots.forEach(function(c,i){ orient.set(c.x+","+c.y,(st.mask>>i)&1); });
    st.movs.forEach(function(m){ orient.set(m.x+","+m.y,m.o); });
    var lvl2=Object.assign({},level,{movables:st.movs});
    var tr=traceLevel(lvl2,orient);
    if(evalWin(level,tr)){
      return {dist:dd, mask:st.mask, rots:rots, movs:st.movs.map(function(m){ return {x:m.x,y:m.y,o:m.o}; })};
    }
    (function(){
      function push(mask2,mv2){ var k=enc(mask2,mv2); if(!dist.has(k)){ dist.set(k,dd+1); queue.push({mask:mask2,movs:mv2,key:k}); } }
      for(var i=0;i<nR;i++) push(st.mask^(1<<i), st.movs);
      st.movs.forEach(function(m,mi){
        push(st.mask, st.movs.map(function(mm,i){ return i===mi? {x:mm.x,y:mm.y,o:mm.o^1} : mm; }));
        DIRS.forEach(function(dd2){
          var nx=m.x+dd2.x, ny=m.y+dd2.y;
          if(nx<0||ny<0||nx>=level.w||ny>=level.h) return;
          if(occ.has(nx+","+ny)) return;
          if(st.movs.some(function(mm,i){ return i!==mi&&mm.x===nx&&mm.y===ny; })) return;
          push(st.mask, st.movs.map(function(mm,i){ return i===mi? {x:nx,y:ny,o:mm.o} : mm; }));
        });
      });
    })();
  }
  return null;
}

// ================= Level-Laufzeit =================
function startLevel(levelObj, mode, meta){
  var src=levelObj;
  var lvl={
    w:src.w, h:src.h,
    emitter:{x:src.emitter.x,y:src.emitter.y,d:src.emitter.d},
    mirrors:(src.mirrors||[]).map(function(m){ return {x:m.x,y:m.y,o:m.o}; }),
    splitters:(src.splitters||[]).map(function(s){ return {x:s.x,y:s.y,o:s.o}; }),
    prism:(src.prism||[]).map(function(p){ return {x:p.x,y:p.y,o:p.o}; }),
    movables:(src.movables||[]).map(function(m){ return {x:m.x,y:m.y,o:m.o}; }),
    filters:(src.filters||[]).map(function(f){ return {x:f.x,y:f.y,c:f.c}; }),
    gates:(src.gates||[]).map(function(g){ return {x:g.x,y:g.y,d:g.d}; }),
    shards:(src.shards||[]).map(function(s){ return {x:s.x,y:s.y}; }),
    portals:(src.portals||[]).map(function(p){ return {a:{x:p.a.x,y:p.a.y},b:{x:p.b.x,y:p.b.y}}; }),
    blocks:(src.blocks||[]).map(function(b){ return {x:b.x,y:b.y}; }),
    targets:(src.targets||[]).map(function(t){ return {x:t.x,y:t.y,c:t.c||0}; }),
    name:src.name||'Rätsel', hint:src.hint||''
  };
  cur={ idx:(meta&&meta.idx)||0, token:{}, lvl:lvl, mode:mode, meta:(meta||{}), src:levelObj,
        moves:0, won:false, earned:0, litKeys:new Set(), shardKeys:new Set(), usedHelp:false,
        hist:[], hintUntil:0, hintSol:null,
        solution:null, autoUsed:false,
        flashT:0, t0:performance.now(), timeSec:0 };
  var sol=solve(lvl);
  cur.opt = sol ? sol.dist : null;
  if(sol){
    cur.solution={mask:sol.mask, rots:sol.rots, movs:sol.movs};
    var map=new Map();
    sol.rots.forEach(function(c,k){ map.set(c.x+","+c.y,(sol.mask>>k)&1); });
    cur.hintSol=map;
  }
  cur.vis=new Map();
  getRots(lvl).concat(lvl.movables).forEach(function(c){
    cur.vis.set(c,{a:angOf(c.o), ta:angOf(c.o), flash:0});
  });
  state.screen = (mode==='test') ? 'test' : 'play';
  drag=null; downPos=null; downCellObj=null; hoverObj=null; parts=[]; rings=[];
  resize();
  retrace(true);
  cur.litKeys=litTargets(lvl,cur.trace);
  cur.shardKeys=new Set(cur.trace.shards);
  mIntensity=0;
  updateHUD();
}
function loadCampaign(i){ startLevel(LEVELS[i],'campaign',{idx:i}); state.current=i; }
function enterDaily(){
  var tk=new Date().toDateString();
  if(state.dailyKey!==tk){ state.dailyKey=tk; state.dailyBest=0; }
  startLevel(DAILY[getDailyIdx()],'daily',{});
}
function px(gx){ return pad+gx*cell+cell/2; }
function py(gy){ return pad+gy*cell+cell/2; }

function retrace(silent){
  cur.trace=traceLevel(cur.lvl,null);
  var nowKeys=litTargets(cur.lvl,cur.trace);
  var nowShards=cur.trace.shards;
  mIntensity = cur.lvl.targets.length ? nowKeys.size/cur.lvl.targets.length : 0;
  if(!silent){
    nowKeys.forEach(function(k){
      if(!cur.litKeys.has(k)){
        sPing();
        var xy=k.split(',').map(Number);
        burst(px(xy[0]),py(xy[1]),false,'spark');
      }
    });
    nowShards.forEach(function(k){
      if(!cur.shardKeys.has(k)){
        sShard();
        var xy=k.split(',').map(Number);
        burst(px(xy[0]),py(xy[1]),false,'shard');
      }
    });
  }
  cur.litKeys=nowKeys;
  cur.shardKeys=nowShards;
  if(nowKeys.size===cur.lvl.targets.length && !cur.won) winLevel();
}
function winLevel(){
  cur.won=true; cur.flashT=performance.now();
  cur.timeSec=(performance.now()-cur.t0)/1000;
  var opt=cur.opt!=null?cur.opt:cur.moves;
  cur.earned = cur.autoUsed ? 1 : (cur.moves<=opt ? 3 : cur.moves<=opt+2 ? 2 : 1);
  state.wins++;
  if(cur.autoUsed) state.autos++;
  if(cur.mode==='campaign' && !state.zen){
    state.stars[cur.idx]=Math.max(state.stars[cur.idx],cur.earned);
    state.totalMoves+=cur.moves;
    state.maxUnlocked=Math.min(LEVELS.length-1, Math.max(state.maxUnlocked, cur.idx+1));
    var bt=state.bestTimes[cur.idx];
    if(bt==null||cur.timeSec<bt) state.bestTimes[cur.idx]=cur.timeSec;
    var prevSh=state.shardMap[cur.idx]||0;
    if(cur.shardKeys.size>prevSh) state.shardMap[cur.idx]=cur.shardKeys.size;
  }
  if(cur.mode==='campaign' && state.zen){
    state.maxUnlocked=Math.min(LEVELS.length-1, Math.max(state.maxUnlocked, cur.idx+1));
  }
  unlock('first');
  if(state.zen) unlock('zen');
  if(cur.mode==='campaign' && cur.earned===3 && !state.zen) unlock('perfect');
  if(cur.mode==='campaign' && cur.earned===3 && !cur.usedHelp && !state.zen) unlock('pure');
  if(cur.timeSec<10) unlock('speed');
  if(cur.mode==='daily') unlock('daily');
  if(totalShards()>=5) unlock('collector');
  if(totalStars()>=40) unlock('master');
  sWin(); vib([30,40,60]);
  shake=1;
  confettiRain();
  cur.lvl.targets.forEach(function(t){ burst(px(t.x),py(t.y),true,'spark'); rings.push({x:px(t.x),y:py(t.y),r:cell*0.3,life:1}); });
  var tok=cur.token;
  setTimeout(function(){ if(cur && cur.token===tok && cur.won) showWinOverlay(); },950);
}

function encodeLevel(L){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(L)))); }catch(e){ return null; }

function decodeLevel(code){
  try{
    var L=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!L||typeof L.w!=='number'||typeof L.h!=='number'||!L.emitter||!Array.isArray(L.targets)||!L.targets.length) return null;
    return L;
  }catch(e){ return null; }

var SIZES=[[6,5],[7,5],[8,6],[9,6],[9,7],[10,7]];
var TOOLS=[
 {id:'emitter', label:'🔦 Strahler'},
 {id:'mirror',  label:'🪞 Spiegel'},
 {id:'movable', label:'🪞⇄ Beweglich'},
 {id:'splitter',label:'🔮 Teiler'},
 {id:'prism',   label:'💠 Prisma'},
 {id:'filter',  label:'🎨 Filter'},
 {id:'target',  label:'💎 Ziel'},
 {id:'shard',   label:'✦ Splitter'},
 {id:'gate',    label:'⏩ Ventil'},
 {id:'block',   label:'⬛ Block'},
 {id:'portal',  label:'🌀 Portal'},
 {id:'erase',   label:'✖ Radieren'},
];
var ed={ w:8,h:6,sizeIdx:2, cells:new Map(), emitter:{x:0,y:2,d:1}, tool:'mirror', valid:null };
ed.cells.set('7,2',{t:'target',c:0});

function buildPalette(){
  paletteEl.innerHTML=TOOLS.map(function(t){ return '<button class="chip '+(t.id===ed.tool?'active':'')+'" data-t="'+t.id+'">'+t.label+'</button>'; }).join('');
  paletteEl.querySelectorAll('[data-t]').forEach(function(el){
    el.addEventListener('click',function(){
      ed.tool=el.dataset.t; buildPalette(); beep(520,0.05,'triangle',0.06);
    });
  });
}
function edSetMsg(s){ edMsgEl.textContent=s; }
function edUpdate(){
  var v=validateEd();
  ed.valid=v;
  edTrace = v.ok ? traceLevel(v.level,null) : null;
}
function validateEd(){
  if(!ed.emitter) return {ok:false,msg:'Setze einen Strahler 🔦.'};
  var arr={mirror:[],splitter:[],prism:[],movable:[],filter:[],target:[],block:[],portal:[],gate:[],shard:[]};
  ed.cells.forEach(function(c,k){
    var xy=k.split(',').map(Number);
    arr[c.t].push({x:xy[0],y:xy[1],o:c.o,c:c.c,d:c.d});
  });
  if(!arr.target.length) return {ok:false,msg:'Setze mindestens ein Ziel 💎.'};
  if(arr.portal.length===1) return {ok:false,msg:'Ein Portal braucht einen Zwilling – setze zwei 🌀.'};
  if(arr.portal.length>2) return {ok:false,msg:'Nur ein Portal-Paar erlaubt.'};
  var level={
    w:ed.w, h:ed.h, emitter:{x:ed.emitter.x,y:ed.emitter.y,d:ed.emitter.d},
    mirrors:arr.mirror.map(function(p){ return {x:p.x,y:p.y,o:p.o||0}; }),
    splitters:arr.splitter.map(function(p){ return {x:p.x,y:p.y,o:p.o||0}; }),
    prism:arr.prism.map(function(p){ return {x:p.x,y:p.y,o:p.o||0}; }),
    movables:arr.movable.map(function(p){ return {x:p.x,y:p.y,o:p.o||0}; }),
    filters:arr.filter.map(function(p){ return {x:p.x,y:p.y,c:p.c||1}; }),
    gates:arr.gate.map(function(p){ return {x:p.x,y:p.y,d:(p.d!=null?p.d:1)}; }),
    shards:arr.shard.map(function(p){ return {x:p.x,y:p.y}; }),
    blocks:arr.block.map(function(p){ return {x:p.x,y:p.y}; }),
    targets:arr.target.map(function(p){ return {x:p.x,y:p.y,c:p.c||0}; }),
    portals:arr.portal.length===2?[{a:{x:arr.portal[0].x,y:arr.portal[0].y},b:{x:arr.portal[1].x,y:arr.portal[1].y}}]:[],
    name:'Eigenes Rätsel', hint:''
  };
  return {ok:true,level:level,msg:''};
}
function levelToEd(L){
  ed.w=Math.min(12,Math.max(4,L.w|0)); ed.h=Math.min(10,Math.max(4,L.h|0));
  ed.cells.clear();
  (L.mirrors||[]).forEach(function(m){ ed.cells.set(m.x+","+m.y,{t:'mirror',o:m.o||0}); });
  (L.splitters||[]).forEach(function(s){ ed.cells.set(s.x+","+s.y,{t:'splitter',o:s.o||0}); });
  (L.prism||[]).forEach(function(p){ ed.cells.set(p.x+","+p.y,{t:'prism',o:p.o||0}); });
  (L.movables||[]).forEach(function(m){ ed.cells.set(m.x+","+m.y,{t:'movable',o:m.o||0}); });
  (L.filters||[]).forEach(function(f){ ed.cells.set(f.x+","+f.y,{t:'filter',c:f.c||1}); });
  (L.gates||[]).forEach(function(g){ ed.cells.set(g.x+","+g.y,{t:'gate',d:(g.d!=null?g.d:1)}); });
  (L.shards||[]).forEach(function(s){ ed.cells.set(s.x+","+s.y,{t:'shard'}); });
  (L.blocks||[]).forEach(function(b){ ed.cells.set(b.x+","+b.y,{t:'block'}); });
  (L.targets||[]).forEach(function(t){ ed.cells.set(t.x+","+t.y,{t:'target',c:t.c||0}); });
  (L.portals||[]).forEach(function(p){
    ed.cells.set(p.a.x+","+p.a.y,{t:'portal'});
    ed.cells.set(p.b.x+","+p.b.y,{t:'portal'});
  });
  ed.emitter={x:L.emitter.x,y:L.emitter.y,d:L.emitter.d};
  var si=SIZES.findIndex(function(s){ return s[0]===ed.w&&s[1]===ed.h; });
  ed.sizeIdx=si>=0?si:2;
  document.getElementById('edSize').textContent='📐 '+ed.w+'×'+ed.h;
}
function editorClick(gx,gy){
  var key=gx+","+gy;
  var existing=ed.cells.get(key);
  var isEm=ed.emitter && ed.emitter.x===gx && ed.emitter.y===gy;
  var t=ed.tool;
  if(t==='erase'){
    if(isEm) ed.emitter=null; else ed.cells.delete(key);
  } else if(t==='emitter'){
    if(isEm){ ed.emitter.d=(ed.emitter.d+1)%4; }
    else if(!existing){ ed.emitter={x:gx,y:gy,d:1}; }
  } else if(t==='portal'){
    if(isEm){ edSetMsg('Auf dem Strahler ist kein Platz.'); edUpdate(); return; }
    var pkeys=[];
    ed.cells.forEach(function(c,k){ if(c.t==='portal') pkeys.push(k); });
    if(existing && existing.t==='portal'){ ed.cells.delete(key); }
    else {
      if(pkeys.length>=2) pkeys.forEach(function(k){ ed.cells.delete(k); });
      ed.cells.set(key,{t:'portal'});
    }
  } else {
    if(isEm){ edSetMsg('Auf dem Strahler ist kein Platz – erst radieren.'); edUpdate(); return; }
    if(existing && existing.t===t){
      if(t==='mirror'||t==='splitter'||t==='prism'||t==='movable') existing.o^=1;
      else if(t==='filter') existing.c=(existing.c%3)+1;
      else if(t==='target') existing.c=(existing.c+1)%7;
      else if(t==='gate') existing.d=(existing.d+1)%4;
    } else {
      var fresh;
      if(t==='mirror'||t==='splitter'||t==='prism'||t==='movable') fresh={t:t,o:0};
      else if(t==='filter') fresh={t:t,c:1};
      else if(t==='target') fresh={t:t,c:0};
      else if(t==='gate') fresh={t:t,d:1};
      else fresh={t:t};
      ed.cells.set(key,fresh);
    }
  }
  beep(480,0.05,'triangle',0.06);
  edSetMsg('');
  edUpdate();
}

function eventToCell(e){
  var r=cv.getBoundingClientRect();
  var x=e.clientX-r.left, y=e.clientY-r.top;
  var gx=Math.floor((x-pad)/cell), gy=Math.floor((y-pad)/cell);
  if(gx<0||gy<0||gx>=viewW||gy>=viewH) return null;
  return {gx:gx,gy:gy};
}
function findRot(gx,gy){
  if(!cur) return null;
  return cur.lvl.mirrors.find(function(c){ return c.x===gx&&c.y===gy; }) ||
         cur.lvl.splitters.find(function(c){ return c.x===gx&&c.y===gy; }) ||
         cur.lvl.prism.find(function(c){ return c.x===gx&&c.y===gy; }) ||
         cur.lvl.movables.find(function(c){ return c.x===gx&&c.y===gy; }) || null;
}
function isMov(c){ return cur.lvl.movables.includes(c); }
function occSet(){
  var s=new Set();
  var L=cur.lvl;
  L.blocks.forEach(function(b){ s.add(b.x+","+b.y); });
  L.targets.forEach(function(t){ s.add(t.x+","+t.y); });
  L.filters.forEach(function(f){ s.add(f.x+","+f.y); });
  L.gates.forEach(function(g){ s.add(g.x+","+g.y); });
  L.portals.forEach(function(p){ s.add(p.a.x+","+p.a.y); s.add(p.b.x+","+p.b.y); });
  getRots(L).forEach(function(r){ s.add(r.x+","+r.y); });
  s.add(L.emitter.x+","+L.emitter.y);
  return s;
}
function rotateNow(c){
  lastRotKey=c.x+","+c.y; lastRotT=performance.now();
  cur.hist.push({t:'rot',x:c.x,y:c.y,o:c.o});
  c.o^=1;
  var v=cur.vis.get(c);
  if(v){ v.ta=angOf(c.o); v.flash=performance.now(); }
  cur.moves++;
  sTick(); vib(8);
  retrace(false);
  updateHUD();
}
cv.addEventListener('pointerdown',function(e){
  ensureAudio();
  if(state.screen==='editor'){
    var pos=eventToCell(e); if(!pos) return;
    editorClick(pos.gx,pos.gy); return;
  }
  if(state.screen!=='play' && state.screen!=='test') return;
  if(!cur || cur.won) return;
  var pos2=eventToCell(e);
  downPos={x:e.clientX,y:e.clientY};
  downCellObj = pos2 ? findRot(pos2.gx,pos2.gy) : null;
  if(downCellObj && isMov(downCellObj)){
    drag={m:downCellObj, sx:e.clientX, sy:e.clientY, px:e.clientX, py:e.clientY, active:false};
  }
});
window.addEventListener('pointermove',function(e){
  if(drag){
    drag.px=e.clientX; drag.py=e.clientY;
    if(!drag.active && Math.hypot(drag.px-drag.sx,drag.py-drag.sy)>12) drag.active=true;
    return;
  }
  if(state.screen==='editor'){
    var pos=eventToCell(e);
    hoverKey=pos?(pos.gx+","+pos.gy):null;
    cv.style.cursor=pos?'pointer':'default';
    return;
  }
  if(!cur || (state.screen!=='play'&&state.screen!=='test')){ hoverObj=null; return; }
  var pos2=eventToCell(e);
  hoverObj=(pos2 && findRot(pos2.gx,pos2.gy)) || null;
  cv.style.cursor=hoverObj?(isMov(hoverObj)?'grab':'pointer'):'default';
});
window.addEventListener('pointerup',function(e){
  if(drag){
    var d=drag; drag=null; downPos=null; downCellObj=null;
    lastDragT=performance.now();
    if(!cur || cur.won) return;
    if(!d.active){ rotateNow(d.m); return; }
    var r=cv.getBoundingClientRect();
    var gx=Math.floor((d.px-r.left-pad)/cell), gy=Math.floor((d.py-r.top-pad)/cell);
    if(gx<0||gy<0||gx>=viewW||gy>=viewH) return;
    if(gx===d.m.x&&gy===d.m.y) return;
    var occ=occSet();
    if(occ.has(gx+","+gy)) return;
    if(cur.lvl.movables.some(function(m){ return m!==d.m&&m.x===gx&&m.y===gy; })) return;
    cur.hist.push({t:'mov',fx:d.m.x,fy:d.m.y,tx:gx,ty:gy});
    d.m.x=gx; d.m.y=gy;
    var v=cur.vis.get(d.m); if(v) v.flash=performance.now();
    cur.moves++;
    sMove(); vib(15);
    retrace(false);
    updateHUD();
    return;
  }
  var c=downCellObj; downCellObj=null;
  var dp=downPos; downPos=null;
  if(!c) return;
  if(!cur || cur.won) return;
  if(state.screen!=='play' && state.screen!=='test') return;
  var moved = dp ? Math.hypot(e.clientX-dp.x, e.clientY-dp.y) : 99;
  if(moved<14) rotateNow(c);
});
cv.addEventListener('click',function(e){
  if(state.screen!=='play' && state.screen!=='test') return;
  if(!cur || cur.won) return;
  if(performance.now()-lastDragT<500) return;
  var pos=eventToCell(e); if(!pos) return;
  var key=pos.gx+","+pos.gy;
  if(key===lastRotKey && performance.now()-lastRotT<500) return;
  var c=findRot(pos.gx,pos.gy); if(!c) return;
  rotateNow(c);
});
cv.addEventListener('pointercancel',function(){ drag=null; downPos=null; downCellObj=null; });

var PCOLS=['#ffd76a','#7fe8ff','#ffffff','#ff9df0','#9dff9d'];
function burst(x,y,big,kind){
  var n=big?44:10;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    var sp=(big?2.1:1.1)*(0.4+Math.random())*cell*0.045;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(big?cell*0.05:0),
      life:1, decay:0.9+Math.random()*0.9, shape:'dot',
      col:(kind==='shard')?((Math.random()<0.5)?'#ffe9a8':'#ffffff'):PCOLS[(Math.random()*PCOLS.length)|0]});
  }
  if(parts.length>520) parts.splice(0,parts.length-520);
}
function confettiRain(){
  for(var i=0;i<70;i++){
    parts.push({
      x:Math.random()*(cell*viewW+pad*2), y:-10-Math.random()*60,
      vx:(Math.random()-0.5)*1.2, vy:1+Math.random()*2,
      life:1.4, decay:0.35+Math.random()*0.3, shape:'conf',
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      w:3+Math.random()*4, h:5+Math.random()*6,
      col:PCOLS[(Math.random()*PCOLS.length)|0]
    });
  }
}

// ================= Zeichnen =================
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function resize(){
  var w,h;
  if(state.screen==='editor'){ w=ed.w; h=ed.h; }
  else if(cur){ w=cur.lvl.w; h=cur.lvl.h; }
  else return;
  viewW=w; viewH=h;
  var stageW=document.getElementById('stage').clientWidth;
  var availH=Math.max(240, Math.min(window.innerHeight*0.72, 640));
  cell=Math.max(32, Math.floor(Math.min((stageW-16)/w,(availH-16)/h)));
  pad=Math.max(10, Math.round(cell*0.3));
  var cw=cell*w+pad*2, ch=cell*h+pad*2;
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);

function beamDots(P,t){
  var total=0, segs=[];
  for(var i=1;i<P.length;i++){
    var dx=P[i].x-P[i-1].x, dy=P[i].y-P[i-1].y;
    var l=Math.sqrt(dx*dx+dy*dy);
    segs.push(l); total+=l;
  }
  if(total<cell*1.2) return;
  var spacing=cell*1.1;
  var off=(t*0.001*cell*2.2)%spacing;
  for(var s=off;s<total;s+=spacing){
    var acc=0;
    for(var k=0;k<segs.length;k++){
      if(acc+segs[k]>=s){
        var f=(s-acc)/segs[k];
        var x=P[k].x+(P[k+1].x-P[k].x)*f, y=P[k].y+(P[k+1].y-P[k].y)*f;
        ctx.save();

        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,cell*0.05),0,Math.PI*2); ctx.fill();
        ctx.restore();
        break;

      acc+=segs[k];
    }
  }
}

    if(age<380){
      var k=age/380;
      ctx.strokeStyle='rgba(140,230,255,'+(0.5*(1-k))+')';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,cell*(0.2+0.45*k),0,Math.PI*2); ctx.stroke();
    }
  }
  if(hoverObj===c && !cur.won){
    ctx.strokeStyle='rgba(140,230,255,0.55)'; ctx.lineWidth=2;
    rr(cx-cell*0.46,cy-cell*0.46,cell*0.92,cell*0.92,cell*0.14); ctx.stroke();
  }
}
function drawPortalLinks(portals,t,usedSet){
  (portals||[]).forEach(function(p){
    ctx.save();
    ctx.strokeStyle='rgba(200,150,255,0.20)'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,9]); ctx.lineDashOffset=-t*0.015;
    ctx.beginPath(); ctx.moveTo(px(p.a.x),py(p.a.y)); ctx.lineTo(px(p.b.x),py(p.b.y)); ctx.stroke();
    ctx.restore();
  });
}
function drawGameScene(t,dt){
  drawBoard(cur.lvl.w,cur.lvl.h,t);
  drawPortalLinks(cur.lvl.portals,t,cur.trace?cur.trace.portals:null);
  cur.lvl.blocks.forEach(drawBlock);
  cur.lvl.filters.forEach(drawFilter);
  cur.lvl.gates.forEach(function(g){ drawGate(g,t); });
  (cur.lvl.shards||[]).forEach(function(s){ drawShard(s.x,s.y,cur.shardKeys.has(s.x+","+s.y),t); });
  drawEmitter(cur.lvl.emitter,t);
  var pu=cur.trace?cur.trace.portals:new Set();
  (cur.lvl.portals||[]).forEach(function(p){
    drawPortalCell(p.a.x,p.a.y,t,pu.has(p.a.x+","+p.a.y));
    drawPortalCell(p.b.x,p.b.y,t,pu.has(p.b.x+","+p.b.y));
  });
  litSet=cur.litKeys;
  cur.lvl.mirrors.forEach(function(m){ drawGameRotatable(m,'mirror',t,dt); });
  cur.lvl.splitters.forEach(function(s){ drawGameRotatable(s,'splitter',t,dt); });
  cur.lvl.prism.forEach(function(p){ drawGameRotatable(p,'prism',t,dt); });
  cur.lvl.movables.forEach(function(m){ drawGameRotatable(m,'movable',t,dt); });
  drawBeams(cur.trace,cur.lvl.emitter,t);
  cur.lvl.targets.forEach(function(tg){ drawTarget(tg,t,cur.trace); });
  if(drag && drag.active){
    var r=cv.getBoundingClientRect();
    var gx=Math.floor((drag.px-r.left-pad)/cell), gy=Math.floor((drag.py-r.top-pad)/cell);
    if(gx>=0&&gy>=0&&gx<viewW&&gy<viewH){
      var occ=occSet();
      var free=!occ.has(gx+","+gy)&&!cur.lvl.movables.some(function(m){ return m!==drag.m&&m.x===gx&&m.y===gy; });
      ctx.strokeStyle=free?'rgba(140,255,190,0.7)':'rgba(255,110,120,0.7)';
      ctx.lineWidth=2.5;
      rr(px(gx)-cell*0.44,py(gy)-cell*0.44,cell*0.88,cell*0.88,cell*0.14); ctx.stroke();
    }
    ctx.save();
    ctx.globalAlpha=0.65;
    drawBar(drag.px-r.left,drag.py-r.top,cur.vis.get(drag.m).a,false,t);
    ctx.restore();
  }
  rings=rings.filter(function(rg){ return rg.life>0; });
  rings.forEach(function(rg){
    rg.r+=cell*0.12; rg.life-=0.03;
    ctx.strokeStyle='rgba(255,230,160,'+(Math.max(0,rg.life)*0.6)+')';
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2); ctx.stroke();
  });
  var dtN=dt/16.7;
  parts=parts.filter(function(p){ return p.life>0; });
  parts.forEach(function(p){
    p.life-=0.02*p.decay*dtN;
    if(p.shape==='conf'){
      p.vy+=0.05*dtN; p.x+=p.vx*dtN; p.y+=p.vy*dtN; p.rot+=p.vr*dtN;
      if(p.life<=0) return;
      ctx.save();
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    } else {
      p.vy+=cell*0.0035*dtN;
      p.x+=p.vx*dtN; p.y+=p.vy*dtN;
      if(p.life<=0) return;
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.8,cell*0.045*p.life+0.8),0,Math.PI*2); ctx.fill();
    }
  });
  ctx.globalAlpha=1;
  if(cur.flashT){
    var age=performance.now()-cur.flashT;
    if(age<450){
      ctx.fillStyle='rgba(255,255,255,'+(0.22*(1-age/450))+')';
      ctx.fillRect(-20,-20,cv.width/dpr+40,cv.height/dpr+40);
    }
  }
}
function drawEditorScene(t){
  drawBoard(ed.w,ed.h,t);
  litSet = (edTrace && ed.valid && ed.valid.ok) ? litTargets(ed.valid.level,edTrace) : new Set();
  var shardLit = (edTrace && ed.valid && ed.valid.ok) ? edTrace.shards : new Set();
  var pu = (edTrace && ed.valid && ed.valid.ok) ? edTrace.portals : new Set();
  var pk=[];
  ed.cells.forEach(function(c,k){ if(c.t==='portal') pk.push(k); });
  if(pk.length===2){
    var a=pk[0].split(',').map(Number), b=pk[1].split(',').map(Number);
    ctx.save();
    ctx.strokeStyle='rgba(200,150,255,0.20)'; ctx.lineWidth=1.5;
    ctx.setLineDash([5,9]); ctx.lineDashOffset=-t*0.015;
    ctx.beginPath(); ctx.moveTo(px(a[0]),py(a[1])); ctx.lineTo(px(b[0]),py(b[1])); ctx.stroke();
    ctx.restore();
  }
  ed.cells.forEach(function(c,k){
    var xy=k.split(',').map(Number), cx=px(xy[0]), cy=py(xy[1]);
    if(c.t==='mirror') drawBar(cx,cy,angOf(c.o||0),false,t);
    else if(c.t==='splitter') drawBar(cx,cy,angOf(c.o||0),true,t);
    else if(c.t==='movable'){ drawMovableMarks(cx,cy); drawBar(cx,cy,angOf(c.o||0),false,t); }
    else if(c.t==='prism') drawPrism(cx,cy,angOf(c.o||0));
    else if(c.t==='block') drawBlock({x:xy[0],y:xy[1]});
    else if(c.t==='filter') drawFilter({x:xy[0],y:xy[1],c:c.c});
    else if(c.t==='gate') drawGate({x:xy[0],y:xy[1],d:(c.d!=null?c.d:1)},t);
    else if(c.t==='shard') drawShard(xy[0],xy[1],shardLit.has(k),t);
    else if(c.t==='target') drawTarget({x:xy[0],y:xy[1],c:c.c||0},t,edTrace);
    else if(c.t==='portal') drawPortalCell(xy[0],xy[1],t,pu.has(k));
  });
  if(ed.emitter) drawEmitter(ed.emitter,t);
  drawBeams(edTrace,ed.emitter,t);
  if(hoverKey){
    var xy=hoverKey.split(',').map(Number);
    ctx.strokeStyle='rgba(255,230,150,0.6)'; ctx.lineWidth=2;
    rr(px(xy[0])-cell*0.46,py(xy[1])-cell*0.46,cell*0.92,cell*0.92,cell*0.14); ctx.stroke();
  }
}
var lastT=performance.now();
function render(t){
  requestAnimationFrame(render);
  var dt=Math.min(50,t-lastT); lastT=t;
  try{
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(shake>0.01){
      shake*=0.88;
      ctx.translate((Math.random()-0.5)*7*shake,(Math.random()-0.5)*7*shake);
    } else shake=0;
    ctx.clearRect(-20,-20,cv.width/dpr+40,cv.height/dpr+40);
    if(state.screen==='editor'){ drawEditorScene(t); return; }
    if(!cur) return;
    drawGameScene(t,dt);
  }catch(err){ /* Render-Failsafe */ }
}

// ================= Start =================
loadCampaign(0);
showHub();
requestAnimationFrame(render);
})();
</script>
